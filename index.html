<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>위시보드 WishBoard</title>
<link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;위시보드&quot;,&quot;short_name&quot;:&quot;위시보드&quot;,&quot;start_url&quot;:&quot;./&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%23F7F5F0&quot;,&quot;theme_color&quot;:&quot;%23FEE500&quot;}" />
<!-- Pretendard: 토스/카카오페이 등 국내 핀테크 앱이 즐겨 쓰는 서체 - 시스템 폰트보다 숫자·한글
     가독성이 좋아 금액이 많이 노출되는 이 앱과 잘 맞는다. -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<!-- Kakao JavaScript SDK - keongyu와 같은 Kakao Developers 앱(JS 키)을 그대로 재사용한다 -->
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.0/kakao.min.js"></script>
<style>
  :root {
    --primary: #FEE500;
    --primary-text: #3C1E1E;
    --bg: #F7F5F0;
    --card: #FFFFFF;
    --text: #1B1B1F;
    --text-sub: #7A7670;
    --border: #ECE8DF;
    --mint: #2DD4A0;
    --danger: #FF5C5C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Roboto, sans-serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  /* 금액처럼 자릿수가 바뀌는 숫자가 나열될 때 폭이 흔들리지 않게 - 토스/카카오페이류 앱이
     금액 표시에 공통으로 쓰는 디테일. */
  .amt, .stat-row, .amount-chip, .gauge-ring-inner { font-variant-numeric: tabular-nums; }
  #app-frame {
    max-width: 460px; margin: 0 auto; min-height: 100vh; background: var(--bg);
    position: relative; padding-bottom: 76px; overflow-x: hidden;
  }
  button, input, textarea { font-family: inherit; }
  button { cursor: pointer; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 50%; border: none; background: #F0EEE7;
    display: inline-flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px;
    font-size: 12.5px; font-weight: 700; background: #F0EEE7; color: var(--text-sub); border: none; white-space: nowrap;
  }
  .chip.active { background: var(--primary); color: var(--primary-text); }
  /* 칩이 화면 너비보다 많아 잘리는데 스크롤할 수 있다는 힌트가 없어 "도전" 뒤로 더 있는 걸
     놓치기 쉬웠다 - 오른쪽 끝을 살짝 페이드시켜 더 있다는 걸 암시한다. */
  .scroll-x {
    display: flex; gap: 7px; overflow-x: auto; padding: 2px 16px 10px;
    -webkit-mask-image: linear-gradient(to right, black calc(100% - 28px), transparent 100%);
    mask-image: linear-gradient(to right, black calc(100% - 28px), transparent 100%);
  }
  .scroll-x::-webkit-scrollbar { display: none; }

  /* Header */
  #topbar {
    position: sticky; top: 0; z-index: 20; background: var(--bg); display: flex; align-items: center;
    justify-content: space-between; padding: 14px 16px 4px;
  }
  #topbar .logo { font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 4px; }
  #topbar .actions { display: flex; gap: 8px; }

  /* Cheer toast */
  #cheer-toast {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%) translateY(-140%); z-index: 300;
    max-width: 420px; width: calc(100% - 32px); background: #1B1B1F; color: #fff; padding: 11px 16px;
    border-radius: 14px; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.25); transition: transform 0.35s cubic-bezier(0.2,0.8,0.3,1);
  }
  #cheer-toast.show { transform: translateX(-50%) translateY(0); }

  /* Wish card */
  .wish-card {
    background: var(--card); border-radius: 18px; padding: 16px; margin: 0 16px 12px; border: 1px solid var(--border);
    transition: transform 0.12s ease;
  }
  /* 눌렀을 때 살짝 눌리는 느낌 - 카카오페이/토스류 앱들이 탭 가능한 요소 전반에 공통으로 주는
     피드백. 실제 기기(터치)에서만 의미가 있어 hover가 아니라 active에만 건다. */
  .wish-card:active, .template-card:active, .occasion-tile:active, .option-item:active,
  .amount-chip:active, .chip:active, .swatch:active { transform: scale(0.97); }
  .btn-primary, .btn-ghost, #fab, .icon-btn { transition: transform 0.12s ease; }
  .btn-primary:active, .btn-ghost:active, #fab:active, .icon-btn:active { transform: scale(0.94); }
  .wish-card.style-flat { box-shadow: none; border: 1px solid var(--text); border-radius: 10px; }
  .wish-card.style-soft { box-shadow: 0 1px 2px rgba(20,18,14,0.04), 0 10px 24px rgba(20,18,14,0.07); border-color: transparent; }
  .wish-card.style-bold { border: 2px solid var(--text); border-radius: 22px; box-shadow: 4px 4px 0 var(--primary); }
  /* 카드 전용이 아니라 여러 화면(위시 상세 헤더, 마이페이지 프로필)에서 재사용되는
     조각들이라 .wish-card로 스코핑하지 않는다 - 스코핑했다가 위시 상세 화면에서 D-day 뱃지/아바타가
     스타일 없이 맨살로 나오던 버그(.stat-row와 같은 종류)가 있었다. */
  .row-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; background: #F0EEE7; display: flex; align-items: center;
    justify-content: center; font-size: 15px; flex-shrink: 0; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-preset-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .avatar-preset { aspect-ratio: 1; border: none; border-radius: 14px; background: #F0EEE7; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .avatar-preset.active { background: var(--primary); }
  .owner { font-size: 12px; font-weight: 800; color: var(--text-sub); }
  .dday {
    margin-left: auto; font-size: 11px; font-weight: 900; padding: 3px 9px; border-radius: 999px;
    background: #FFF0E8; color: #E0692B; flex-shrink: 0;
  }
  .dday.urgent { background: #FFE5E5; color: var(--danger); }
  .title { font-size: 15.5px; font-weight: 900; margin-bottom: 3px; }
  .subtitle { font-size: 12px; color: var(--text-sub); margin-bottom: 10px; }
  .gauge-track { height: 9px; border-radius: 6px; background: #F0EEE7; overflow: hidden; position: relative; }
  .gauge-fill { height: 100%; border-radius: 6px; background: var(--primary); transition: width 0.5s ease; }
  .gauge-tick { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: rgba(0,0,0,0.14); }
  .gauge-ring { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .gauge-ring-inner { width: 19px; height: 19px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 6.5px; font-weight: 900; }
  .cheer-ticker { margin: 0 16px 10px; padding: 9px 12px; border-radius: 12px; background: #FFFBEF; border: 1px dashed var(--primary); font-size: 11.5px; font-weight: 700; color: #8A6D00; }
  .stat-row { display: flex; justify-content: space-between; align-items: center; margin-top: 7px; font-size: 11.5px; }
  .stat-row .pct { font-weight: 900; }
  .stat-row .amt { color: var(--text-sub); }

  /* Bottom nav */
  #bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 460px;
    background: var(--card); border-top: 1px solid var(--border); display: flex; z-index: 50;
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  #bottom-nav .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none;
    font-size: 10px; font-weight: 800; color: #B7B2A8; padding: 4px 0;
  }
  #bottom-nav .nav-btn.active { color: var(--text); }
  #bottom-nav .nav-btn .ic { font-size: 19px; border-radius: 999px; padding: 2px 12px; transition: background-color 0.15s ease; }
  #bottom-nav .nav-btn.active .ic { background: var(--primary); }
  #fab {
    position: fixed; bottom: 68px; left: 50%; transform: translateX(-50%); width: 54px; height: 54px; border-radius: 50%;
    background: var(--primary); color: var(--primary-text); border: 4px solid var(--bg); font-size: 24px; font-weight: 900;
    box-shadow: 0 6px 16px rgba(0,0,0,0.18); z-index: 55; display: flex; align-items: center; justify-content: center;
  }

  /* Sheets */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(20,18,14,0.45); z-index: 100; display: flex; align-items: flex-end;
    justify-content: center;
  }
  .bottom-sheet {
    width: 100%; max-width: 460px; max-height: 90dvh; overflow-y: auto; background: var(--bg);
    border-radius: 22px 22px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 14px; animation: sheet-up 0.28s cubic-bezier(0.2,0.8,0.3,1);
  }
  /* 카카오페이/토스 바텀시트의 대표적인 시각 신호인 드래그 핸들 바 - 실제 드래그로 닫는 기능은
     없지만("✕" 버튼으로 닫음), 시트라는 것을 한눈에 알아보게 하는 장식. 스크롤해도 맨 위에
     붙어있게 sticky 처리. */
  .bottom-sheet::before {
    content: ''; display: block; width: 40px; height: 4px; border-radius: 999px; background: var(--border);
    margin: 2px auto 4px; flex-shrink: 0; position: sticky; top: 0;
  }
  @keyframes sheet-up { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; }
  .sheet-head h2 { font-size: 16px; font-weight: 900; margin: 0; }

  /* 위시 상세는 팝업(바텀시트)이 아니라 진짜 화면 전환처럼 보이게 - 뒤로가기(브라우저/안드로이드
     제스처 포함)로 나갈 수 있도록 history.pushState + hashchange로 여닫는다(아래 스크립트 참고). */
  /* 애니메이션을 일부러 안 넣었다 - render()가 매번 #root를 통째로 다시 그려서 .detail-page도
     매번 "새" 엘리먼트가 되는데, CSS 애니메이션을 걸어두면 그때마다(예: 선물하기 폼을 펼치거나
     채팅 폴링으로 메시지가 갱신될 때) 다시 재생되어 화면이 깜빡이는 것처럼 보였다. */
  .detail-page {
    position: fixed; inset: 0; z-index: 110; background: var(--bg); overflow-y: auto;
    display: flex; flex-direction: column; gap: 14px; padding: 14px 18px calc(18px + env(safe-area-inset-bottom));
  }

  /* 로그인 게이트 - renderApp()이 다른 모든 화면 대신 이것만 그린다(카카오 로그인 전엔
     위시 내용을 아예 보여주지 않는다). 별도 z-index/오버레이가 아니라 화면 전체를 통째로
     대체하는 방식이라 .detail-page처럼 fixed일 필요는 없고, 그냥 #root의 유일한 내용이 된다. */
  .login-gate {
    min-height: 100dvh; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
    background: linear-gradient(180deg, #FFFDF3 0%, var(--bg) 60%);
    padding: calc(52px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));
    text-align: center;
  }
  .login-gate-hero { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .login-gate-icon {
    width: 80px; height: 80px; border-radius: 24px; background: var(--primary);
    display: flex; align-items: center; justify-content: center; font-size: 40px;
    box-shadow: 0 12px 26px rgba(254,229,0,0.4);
  }
  .login-gate-hero h1 { font-size: 25px; font-weight: 900; margin: 8px 0 0; letter-spacing: -0.4px; }
  .login-gate-hero p { font-size: 13.5px; color: var(--text-sub); line-height: 1.6; margin: 0; font-weight: 600; }
  .login-gate-features { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; margin: 28px 0; }
  .login-gate-feature {
    display: flex; align-items: center; gap: 12px; text-align: left; background: var(--card);
    border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; font-size: 13px; font-weight: 800;
  }
  .login-gate-feature .ic {
    font-size: 18px; flex-shrink: 0; width: 34px; height: 34px; border-radius: 11px; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  .login-gate-cta { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; }
  .login-gate-kakao-btn {
    width: 100%; border: none; border-radius: 16px; padding: 16px; font-size: 15.5px; font-weight: 900;
    background: var(--primary); color: var(--primary-text); display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 10px 22px rgba(254,229,0,0.45); cursor: pointer;
  }
  .login-gate-fine { font-size: 11px; color: var(--text-sub); line-height: 1.5; }
  /* 아이템 사진 크게 보기 - 핀치줌/드래그팬은 render()를 안 거치고 JS로 transform을 직접
     건드리므로(재렌더가 제스처 중간에 DOM을 갈아치우면 끊긴다), transition 없이 즉시 반응한다. */
  #image-viewer { position: fixed; inset: 0; z-index: 400; background: rgba(10,9,7,0.94); display: flex; flex-direction: column; }
  #image-viewer-stage { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; touch-action: none; }
  #image-viewer-img { max-width: 100%; max-height: 100%; user-select: none; -webkit-user-drag: none; }
  .iv-nav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,0.14); border: none; color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  /* .bottom-sheet/.detail-page는 flex column인데, 시트 전체 내용이 max-height를 넘으면
     기본 flex-shrink:1 때문에 textarea가 rows로 정한 높이보다 찌그러들어(제일 유연한 요소라
     제일 많이 줄어든다) placeholder/입력한 글자 아랫부분이 잘려 보인다 - 시트 스크롤
     (overflow-y:auto)가 넘치는 걸 처리하니, 폼 필드는 줄어들지 않게 고정한다. */
  textarea, input[type="text"], input[type="number"] {
    width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 13.5px;
    background: #fff; color: var(--text); flex-shrink: 0;
  }
  textarea { resize: none; line-height: 1.5; }
  /* 꼭 채워야 진행되는 입력칸(제목/아이템 이름/가격 등, placeholder에 *가 붙은 것들)을
     한눈에 알아볼 수 있게 연한 주황색 바탕을 준다 - 브라우저 기본 검증 팝업은 안 쓰고
     JS로만 막고 있는 폼이라, required 속성은 여기 스타일링 용도로만 쓴다. */
  input:required, textarea:required { background: #FFF1E0; }
  .btn-primary {
    width: 100%; border: none; border-radius: 14px; padding: 13px; font-size: 14.5px; font-weight: 900;
    background: var(--primary); color: var(--primary-text);
  }
  .btn-primary:disabled { opacity: 0.45; }
  .btn-ghost { background: #F0EEE7; color: var(--text); border: none; border-radius: 14px; padding: 13px; font-size: 13.5px; font-weight: 800; }

  /* Quick amount chips */
  .amount-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .amount-chip {
    padding: 10px 2px; border-radius: 10px; border: 1.5px solid var(--border); background: #fff;
    font-size: 11.5px; font-weight: 800; text-align: center;
  }
  .amount-chip.active { border-color: var(--text); background: var(--primary); color: var(--primary-text); }

  /* Guestbook / timeline */
  .cheer-item { display: flex; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .cheer-item:last-child { border-bottom: none; }
  .cheer-item .who { font-size: 12px; font-weight: 800; }
  .cheer-item .msg { font-size: 12px; color: var(--text-sub); margin-top: 1px; }
  .cheer-item .amt { margin-left: auto; font-size: 12px; font-weight: 900; color: var(--text); white-space: nowrap; }

  /* Occasion picker */
  .occasion-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .occasion-tile {
    border: 1.5px solid var(--border); border-radius: 16px; padding: 14px 6px; text-align: center; background: #fff;
  }
  .occasion-tile.active { border-color: var(--text); background: var(--primary); }
  .occasion-tile .emo { font-size: 26px; }
  .occasion-tile .lbl { font-size: 11.5px; font-weight: 800; margin-top: 4px; }

  .template-card {
    border: 1.5px solid var(--border); border-radius: 14px; padding: 12px; background: #fff; text-align: left;
    width: 100%; display: flex; gap: 10px; align-items: center;
  }
  .template-card.active { border-color: var(--text); background: #FFFBEF; }
  .template-card .emo { font-size: 22px; }
  .template-card .t { font-size: 13px; font-weight: 800; }
  .template-card .s { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

  .suggest-chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 7px 11px; border-radius: 10px; border: 1px dashed var(--primary);
    background: #FFFBEF; font-size: 11.5px; font-weight: 700; color: #8A6D00;
  }

  /* Explore recommendation card */

  /* Customization */
  .swatch-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { width: 42px; height: 42px; border-radius: 50%; border: 3px solid transparent; }
  .swatch.active { border-color: var(--text); }
  .option-row { display: flex; flex-direction: column; gap: 8px; }
  .option-item {
    display: flex; justify-content: space-between; align-items: center; padding: 11px 13px; border-radius: 12px;
    border: 1.5px solid var(--border); background: #fff; font-size: 13px; font-weight: 700;
  }
  .option-item.active { border-color: var(--text); background: #FFFBEF; }
  .toggle { width: 40px; height: 22px; border-radius: 999px; background: #E4E0D6; position: relative; flex-shrink: 0; border: none; }
  .toggle.on { background: var(--primary); }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left 0.15s ease; }
  .toggle.on::after { left: 20px; }

  .empty-state { text-align: center; padding: 60px 30px; color: var(--text-sub); font-size: 13px; line-height: 1.7; }

  .notif-item { display: flex; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--border); }
  .notif-item .ic { font-size: 20px; flex-shrink: 0; }
  .notif-item .txt { font-size: 12.5px; line-height: 1.5; }
  .notif-item .time { font-size: 10.5px; color: var(--text-sub); margin-top: 2px; }
  .notif-item.unread { background: #FFFBEF; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'wishboard_v1';

  // ============ Render engine (focus/selection preserving full re-render) ============
  function render() {
    // IME(한글 등) 조합 중에는 절대 DOM을 재구성하지 않는다 - render()가 #root를 통째로 교체해
    // 입력 중인 <textarea>/<input>을 매번 새로 만들면 조합 세션이 끊겨 자모가 합쳐지지 않고
    // 그대로 찍힌다. 조합이 끝나면(compositionend) 다시 render()를 호출해 최신 상태를 반영한다.
    var composingEl = document.activeElement;
    if (composingEl && composingEl.dataset && composingEl.dataset.composing === 'true') return;

    applyTheme();
    var active = document.activeElement;
    var activeId = active && active.id;
    var selStart = active && ('selectionStart' in active) ? active.selectionStart : null;
    var selEnd = active && ('selectionEnd' in active) ? active.selectionEnd : null;
    var scrollables = Array.prototype.slice.call(document.querySelectorAll('.bottom-sheet, .scroll-x, .chat-scroll, .detail-page'));
    var savedScroll = scrollables.map(function (el) { return { top: el.scrollTop, left: el.scrollLeft }; });

    document.getElementById('root').innerHTML = renderApp();

    if (activeId) {
      var el = document.getElementById(activeId);
      if (el) {
        el.focus();
        if (selStart != null && 'setSelectionRange' in el) {
          try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
        }
      }
    }
    var newScrollables = Array.prototype.slice.call(document.querySelectorAll('.bottom-sheet, .scroll-x, .chat-scroll, .detail-page'));
    newScrollables.forEach(function (el, i) {
      if (savedScroll[i]) { el.scrollTop = savedScroll[i].top; el.scrollLeft = savedScroll[i].left; }
    });
    if (state.ui.imageViewer) attachImageViewerGestures();
  }

  function showToast(text) {

    window._toastTimer = setTimeout(function () {
      var el = document.getElementById('cheer-toast');
      if (el) el.classList.remove('show');
      setTimeout(function () { state.ui.toast = null; render(); }, 350);
    }, 2600);
  }

  // 그 페이지를 닫는다. history.back()으로 닫힐 때도 이 이벤트가 뒤이어 발생해 render()가 불린다.

  // false로 불러서 사용자가 읽던 스크롤 위치를 그대로 유지한다(매번 맨 위로 튀는 "깜빡임" 방지).
  function fetchChatMessages(wishId, scrollToBottom) {
    fetch(API_BASE + '/api/wishes/' + encodeURIComponent(wishId) + '/chat')
      .then(function (res) { return res.ok ? res.json() : { messages: [] }; })
      .then(function (data) {
        if (state.ui.chatWishId !== wishId) return; // 그 사이 닫혔으면 무시
        state.ui.chatMessages = data.messages || [];
        render();
        if (scrollToBottom) {
          var el = document.querySelector('.chat-scroll');
          if (el) el.scrollTop = el.scrollHeight;
        }
      })
      .catch(function () { state.ui.chatMessages = []; render(); });
  }
  window.closeChat = function () {
    state.ui.chatWishId = null; state.ui.chatMessages = null;
    if (/^#chat=/.test(location.hash)) history.back(); else render();
  };
  window.setChatDraft = function (el) { state.ui.chatDraft = el.value; };
  window.deleteChatMessage = function (messageId) {
    if (!confirm('이 메시지를 삭제할까요?')) return;
    var wishId = state.ui.chatWishId;
    fetch(API_BASE + '/api/wishes/' + encodeURIComponent(wishId) + '/chat/' + encodeURIComponent(messageId) + '?user_id=' + encodeURIComponent(state.user.id), { method: 'DELETE' })
      .then(function (res) { return res.ok ? res.json() : Promise.reject(new Error('delete failed')); })
      .then(function () { fetchChatMessages(wishId); })
      .catch(function () { showToast('삭제에 실패했어요.'); });
  };
  // 서버 응답(왕복 한 번)을 기다렸다가 전체 메시지 목록을 다시 받아오면 그만큼 화면에 늦게
  // 뜬다 - 보낸 사람 화면에는 낙관적으로 바로 붙이고, 서버가 준 진짜 id로 조용히 바꿔치기한다.
  // 실패하면 그 메시지만 빼고 초안을 복구한다.
  window.sendChatMessage = function () {
    var text = (state.ui.chatDraft || '').trim();
    if (!text) return;
    if (containsBannedWord(text)) { showToast('부적절한 단어는 사용할 수 없어요.'); return; }
    var wishId = state.ui.chatWishId;
    var tempId = uid('temp');
    state.ui.chatMessages = (state.ui.chatMessages || []).concat([{
      id: tempId, fromUserId: state.user.id, fromName: state.user.name, text: text, at: new Date().toISOString(),
    }]);
    state.ui.chatDraft = '';
    render();
    var el = document.querySelector('.chat-scroll');
    if (el) el.scrollTop = el.scrollHeight;
    fetch(API_BASE + '/api/wishes/' + encodeURIComponent(wishId) + '/chat', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ from_user_id: state.user.id, from_name: state.user.name, from_avatar: state.user.avatar, text: text }),
    })
      .then(function (res) { return res.ok ? res.json() : Promise.reject(new Error('send failed')); })
      .then(function (data) {
        var msg = (state.ui.chatMessages || []).filter(function (m) { return m.id === tempId; })[0];
        if (!msg) return;
        msg.id = data.id;
        render(); // 삭제 버튼 onclick에 박히는 id를 진짜 id로 갱신 - 안 하면 그 사이 삭제 눌렀을 때 실패한다.
      })
      .catch(function () {
        state.ui.chatMessages = (state.ui.chatMessages || []).filter(function (m) { return m.id !== tempId; });
        state.ui.chatDraft = text;
        showToast('메시지 전송에 실패했어요.');
        render();
      });
  };

  // 위시 관심(찜) 등록/해제 - 누구나 할 수 있고, 서버 응답을 기다린 뒤 목록을 다시 받아온다
  // (낙관적 업데이트 없이 서버가 최종 진실이라는 이 앱의 다른 액션들과 같은 원칙).
  window.toggleFollow = function (wishId, isFollowing) {
    var method = isFollowing ? 'DELETE' : 'POST';
    var url = API_BASE + '/api/wishes/' + encodeURIComponent(wishId) + '/follow' + (isFollowing ? '?user_id=' + encodeURIComponent(state.user.id) : '');
    var opts = { method: method };
    if (!isFollowing) {
      opts.headers = { 'content-type': 'application/json' };
      opts.body = JSON.stringify({ user_id: state.user.id });
    }
    fetch(url, opts)
      .then(function (res) { return res.ok ? res.json() : Promise.reject(new Error('follow toggle failed')); })
      .then(function () { syncWishesFromServer(); })
      .catch(function () { showToast('처리에 실패했어요. 다시 시도해주세요.'); });
  };

  // 위시 공유 링크 - 단체 위시는 "?join=" 링크(받은 사람이 그 링크로 스스로 합류), 개인 위시는
  // "#wish=" 딥링크(그냥 보고 선물할 수 있게)로 갈린다. 링크 복사/카카오톡 공유 둘 다 공통으로 쓴다.
  function buildShareLink(wish) {
    return wish.type === 'group'
      ? location.origin + location.pathname + '?join=' + encodeURIComponent(wish.id)
      : location.origin + location.pathname + '#wish=' + encodeURIComponent(wish.id);
  }
  window.copyInviteLink = function (wishId) {
    var wish = state.wishes.filter(function (w) { return w.id === wishId; })[0];
    if (!wish) return;
    var link = buildShareLink(wish);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link)
        .then(function () { showToast('링크가 복사됐어요! 친구에게 보내보세요 💌'); })
        .catch(function () { showToast(link); });
    } else {
      showToast(link);
    }
  };

  // 카카오톡으로 바로 공유 - 'text' objectType(이미지 없이 텍스트+링크)을 쓴다. 실제 존재하지
  // 않는 og-image URL을 imageUrl로 넘기면(keongyu에서 겪은 문제) 받는 사람 화면에 "찾을 수
  // 없음"으로 뜨는 카드가 되므로, 브랜드 이미지 에셋이 따로 없는 지금은 이 방식이 안전하다.
  window.shareInviteViaKakao = function (wishId) {
    var wish = state.wishes.filter(function (w) { return w.id === wishId; })[0];
    if (!wish) return;
    var link = buildShareLink(wish);
    var isGroup = wish.type === 'group';
    if (!window.Kakao || !Kakao.isInitialized() || !Kakao.Share || typeof Kakao.Share.sendDefault !== 'function') {
      showToast('카카오톡 공유를 사용할 수 없어요. 링크 복사를 이용해주세요.');
      return;
    }
    try {
      Kakao.Share.sendDefault({
        objectType: 'text',
        text: wish.emoji + ' ' + wish.title + '\n' + (isGroup ? '위시보드에서 함께 위시를 채워봐요! 아래 링크로 참여해보세요 💌' : '위시보드에서 제 위시를 확인해보세요! 선물도 보낼 수 있어요 💌'),
        link: { mobileWebUrl: link, webUrl: link },
      });
    } catch (err) {
      showToast('카카오톡 공유창을 여는 데 실패했어요.');
    }
  };

  window.pickGiftAmount = function (amount) {
    state.ui.giftDraft.amount = amount;
    state.ui.giftDraft.customAmount = '';
    render();
  };
  window.setCustomGiftAmount = function (el) {
    var v = el.value.replace(/[^0-9]/g, '');
    el.value = v;
    state.ui.giftDraft.customAmount = v;
    state.ui.giftDraft.amount = 0;
  };
  window.setGiftMessage = function (el) { state.ui.giftDraft.message = el.value; };
  window.toggleGiftAnonymous = function () { state.ui.giftDraft.anonymous = !state.ui.giftDraft.anonymous; render(); };

  window.sendGift = function () {
    var wish = state.wishes.filter(function (w) { return w.id === state.ui.wishDetailId; })[0];
    var draft = state.ui.giftDraft;
    if (!wish || !draft || !draft.itemId || state.ui.sendingGift) return;
    var amount = draft.customAmount ? Number(draft.customAmount) : draft.amount;
    if (!amount || amount < 100) { showToast('보탤 금액을 선택하거나 입력해주세요'); return; }
    if (containsBannedWord(draft.message)) { showToast('응원 메시지에 부적절한 단어는 사용할 수 없어요.'); return; }
    // 목표금액 초과분 캡핑은 서버(handlePostGift)가 최종 진실이다 - 여러 사람이 거의 동시에
    // 보태도 서버가 하나씩 순서대로 처리하니 진행률이 100%를 넘지 않는다. 클라이언트는 그 결과를
    // 그대로 반영만 한다.
    state.ui.sendingGift = true;
    render();
    fetch(API_BASE + '/api/wishes/' + encodeURIComponent(wish.id) + '/gift', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        item_id: draft.itemId, from_user_id: state.user.id, from_name: state.user.name, from_avatar: state.user.avatar,
        amount: amount, message: draft.message.trim(), anonymous: draft.anonymous,
      }),
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        state.ui.sendingGift = false;
        if (!result.ok) { showToast(result.data.error || '보태기에 실패했어요.'); render(); return; }
        var applied = result.data.applied;
        state.ui.giftDraft = null;
        showToast(applied < amount ? ('🎉 목표금액까지만 반영돼서 ' + formatWon(applied) + ' 보탰어요!') : ('🎉 카카오페이로 ' + formatWon(applied) + ' 보탰어요!'));
        syncWishesFromServer();
      })
      .catch(function () {
        state.ui.sendingGift = false;
        showToast('네트워크 오류로 실패했어요. 다시 시도해주세요.');
        render();
      });
  };
  // 위시 주인이 받은 후원을 거절한다 - 기록을 지우고 모금액에서 빼며, 보낸 사람에게 알린다.
  window.rejectGift = function (wishId, contributionId) {
    if (!confirm('이 후원을 거절할까요? 모금액에서 제외돼요.')) return;
    fetch(API_BASE + '/api/wishes/' + encodeURIComponent(wishId) + '/gift/' + encodeURIComponent(contributionId) + '?user_id=' + encodeURIComponent(state.user.id), { method: 'DELETE' })
      .then(function (res) { return res.ok ? res.json() : Promise.reject(new Error('reject failed')); })
      .then(function () {
        showToast('후원을 거절했어요.');
        syncWishesFromServer();
      })
      .catch(function () { showToast('거절에 실패했어요.'); });
  };
  // 감사 인사는 DB에 상태를 안 남겨서(위 handleThankGift 주석 참고) "이미 보냈는지"를 이
  // 세션 동안만 로컬에서 기억한다 - 새로고침하면 다시 누를 수 있지만, 반복 클릭으로 같은
  // 사람한테 알림이 여러 번 가는 것 정도만 막아주면 충분하다.
  window.sendThankYou = function (wishId, contributionId) {
    if (state.ui.thankedContributions[contributionId]) return;
    state.ui.thankedContributions[contributionId] = true;
    render();
    fetch(API_BASE + '/api/wishes/' + encodeURIComponent(wishId) + '/gift/' + encodeURIComponent(contributionId) + '/thanks', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ user_id: state.user.id }),
    }).catch(function () { showToast('감사 인사 전송에 실패했어요.'); });
  };
  window.setWishCommentDraft = function (el) { state.ui.wishCommentDraft = el.value; };
  // goal_type='comments' 목표(댓글수)를 위해 돈 없이도 남길 수 있는 댓글 - 기존 응원 방명록은
  // 선물 메시지뿐이라 돈을 안 보태면 댓글을 못 남겼다.
  window.sendWishComment = function (wishId) {
    var text = (state.ui.wishCommentDraft || '').trim();
    if (!text) { showToast('댓글 내용을 입력해주세요'); return; }
    if (containsBannedWord(text)) { showToast('부적절한 단어는 사용할 수 없어요.'); return; }
    state.ui.wishCommentDraft = '';
    render();
    fetch(API_BASE + '/api/wishes/' + encodeURIComponent(wishId) + '/comments', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ user_id: state.user.id, name: state.user.name, avatar: state.user.avatar, text: text }),
    })
      .then(function (res) { return res.ok ? res.json() : Promise.reject(new Error('comment failed')); })
      .then(function () { syncWishesFromServer(); })
      .catch(function () { showToast('댓글 등록에 실패했어요.'); });
  };
  window.deleteWishComment = function (wishId, commentId) {
    fetch(API_BASE + '/api/wishes/' + encodeURIComponent(wishId) + '/comments/' + encodeURIComponent(commentId) + '?user_id=' + encodeURIComponent(state.user.id), { method: 'DELETE' })
      .then(function (res) { return res.ok ? res.json() : Promise.reject(new Error('delete failed')); })
      .then(function () { syncWishesFromServer(); })
      .catch(function () { showToast('댓글 삭제에 실패했어요.'); });
  };
  window.pickRemainingGiftAmount = function (itemId) {
    var wish = state.wishes.filter(function (w) { return w.id === state.ui.wishDetailId; })[0];
    var item = wish && (wish.items || []).filter(function (i) { return i.id === itemId; })[0];
    if (!item) return;
    var remaining = Math.max(0, item.goalAmount - item.currentAmount);
    if (remaining <= 0) return;
    state.ui.giftDraft.customAmount = String(remaining);
    state.ui.giftDraft.amount = 0;
    render();
  };
  window.toggleShowFundedItems = function () { state.ui.showFundedItems = !state.ui.showFundedItems; render(); };
  // 위시 주인이 관심 등록자/후원자/단체 멤버 전원에게 진행 상황을 한 번에 알린다(채팅과
  // 별개) - 별도 입력 폼 없이 prompt 하나로 받는다, 자주 쓰는 기능이 아니라 폼까지는 과함.
  window.sendWishUpdate = function (wishId) {
    var message = (window.prompt('후원자들에게 보낼 업데이트 내용을 입력해주세요 (최대 200자)') || '').trim();
    if (!message) return;
    if (containsBannedWord(message)) { showToast('부적절한 단어는 사용할 수 없어요.'); return; }
    fetch(API_BASE + '/api/wishes/' + encodeURIComponent(wishId) + '/update', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ user_id: state.user.id, message: message }),
    })
      .then(function (res) { return res.ok ? res.json() : Promise.reject(new Error('update failed')); })
      .then(function (data) { showToast('업데이트를 ' + (data.notified || 0) + '명에게 보냈어요.'); })
      .catch(function () { showToast('업데이트 전송에 실패했어요.'); });
  };

  // ---- Create wizard ----
  // 5단계 위저드: ① 개인/단체 선택 ② 테마(occasion) ③ 템플릿 ④ 상세정보 ⑤ 확인
  // 위저드/꾸미기/아바타 피커는 서로 무관한 "전체 화면 흐름"이라 동시에 떠 있으면 안 되는데
  // (위시 상세→채팅→사진뷰어처럼 의도적으로 겹쳐 쌓이는 것과 다름), 이 셋 각각의 open 함수가
  // 서로의 상태를 안 건드려서 어쩌다 두 개가 동시에 열리면 겹쳐 보이는 문제가 있었다.
  function closeTopLevelOverlays() {
    state.ui.createWizard = null;
    state.ui.customizeOpen = false;
    state.ui.avatarPickerOpen = false;
  }
  window.openCreateWizard = function () {
    closeTopLevelOverlays();
    state.ui.createWizard = { step: 1, wishType: 'personal', groupName: '', occasion: null, templateIdx: null, title: '', subtitle: '', story: '', items: [{ name: '', link: '', imageUrls: [], note: '', pledge: '', goal: '', goalType: 'money', goalCount: '' }], days: '', emoji: '🎁', suggestedItems: [], isPrivate: false };
    render();
  };
  window.closeCreateWizard = function () { state.ui.createWizard = null; render(); };

  window.setWizardType = function (type) {
    var w = state.ui.createWizard;
    w.wishType = type;
    render();
  };

  window.pickOccasion = function (type) {
    var w = state.ui.createWizard;
    w.occasion = type;
    w.emoji = OCCASIONS.filter(function (o) { return o.type === type; })[0].emoji;
    w.step = 3;
    render();
  };

  window.pickTemplate = function (idx) {
    var w = state.ui.createWizard;
    var tpl = TEMPLATES[w.occasion][idx];
    w.templateIdx = idx;
    w.title = tpl.title;
    w.subtitle = tpl.subtitle;
    w.items = [{ name: tpl.title, link: '', imageUrls: [], note: '', pledge: '', goal: tpl.goal, goalType: 'money', goalCount: '' }];
    w.story = '';
    w.step = 4;
    render();
  };
  window.skipTemplateCustom = function () {
    var w = state.ui.createWizard;
    w.templateIdx = null;
    w.title = '';
    w.subtitle = '';
    w.items = [{ name: '', link: '', imageUrls: [], note: '', pledge: '', goal: '', goalType: 'money', goalCount: '' }];
    w.step = 4;
    render();
  };

  // ---- 위저드: 위시 아이템 목록 (런닝화, 유니폼처럼 위시 하나를 이루는 개별 상품들) ----
  window.addWizardItem = function () {
    state.ui.createWizard.items.push({ name: '', link: '', imageUrls: [], note: '', pledge: '', goal: '', goalType: 'money', goalCount: '' });
    render();
  };
  window.removeWizardItem = function (idx) {
    var w = state.ui.createWizard;
    if (w.items.length <= 1) return;
    w.items.splice(idx, 1);
    render();
  };
  window.wizardSetItemField = function (idx, field, el) {
    state.ui.createWizard.items[idx][field] = el.value;
  };
  window.setWizardItemGoalType = function (idx, type) { state.ui.createWizard.items[idx].goalType = type; render(); };
  window.pickWizardItemImage = function (idx, inputEl) {
    var file = inputEl.files && inputEl.files[0];
    inputEl.value = '';
    var item = state.ui.createWizard.items[idx];
    if (!file || !item) return;
    if ((item.imageUrls || []).length >= 5) { showToast('사진은 최대 5장까지 올릴 수 있어요.'); return; }
    uploadImageFile(file)
      .then(function (url) { item.imageUrls = (item.imageUrls || []).concat([url]); render(); })
      .catch(function (err) { showToast(err.message || '이미지 업로드에 실패했어요.'); });
  };
  window.removeWizardItemImage = function (idx, imgIdx) {
    var item = state.ui.createWizard.items[idx];
    if (!item) return;
    item.imageUrls.splice(imgIdx, 1);
    render();
  };
  window.addWizardItemImageUrl = function (idx, btn) {
    var input = btn.previousElementSibling;
    var url = (input.value || '').trim();
    var item = state.ui.createWizard.items[idx];
    if (!url || !item) return;
    if ((item.imageUrls || []).length >= 5) { showToast('사진은 최대 5장까지 올릴 수 있어요.'); return; }
    item.imageUrls = (item.imageUrls || []).concat([url]);
    render();
  };

  window.wizardSetField = function (field, el) { setStateAtPath('ui.createWizard.' + field, el.value); };
  window.toggleWizardPrivate = function () { state.ui.createWizard.isPrivate = !state.ui.createWizard.isPrivate; render(); };
  window.wizardSetStory = function (el) {
    var w = state.ui.createWizard;
    w.story = el.value;
    w.suggestedItems = computeSuggestions(el.value);
    render();
  };
  function computeSuggestions(text) {
    var found = [];
    KEYWORD_SUGGESTIONS.forEach(function (group) {
      var hit = group.keys.some(function (k) { return text.indexOf(k) >= 0; });
      if (hit) found = found.concat(group.items);
    });
    return found.slice(0, 4);
  }
  window.applySuggestion = function (item) {
    var w = state.ui.createWizard;
    w.story = (w.story || '').trim() + (w.story && w.story.trim() ? '\n' : '') + '🎁 추천 보태기 아이템: ' + item;
    render();
  };

  window.wizardNextStep = function () {
    var w = state.ui.createWizard;
    if (w.step === 1 && w.wishType === 'group') {
      if (!w.groupName.trim()) { showToast('그룹 이름을 입력해주세요'); return; }
      if (containsBannedWord(w.groupName)) { showToast('그룹 이름에 부적절한 단어가 포함되어 있어요.'); return; }
    }
    if (w.step === 4) {
      if (!w.title.trim()) { showToast('제목을 입력해주세요'); return; }
      if ([w.title, w.subtitle, w.story].concat(w.items.map(function (i) { return i.name; })).concat(w.items.map(function (i) { return i.note; })).concat(w.items.map(function (i) { return i.pledge; })).some(containsBannedWord)) {
        showToast('부적절한 단어는 사용할 수 없어요.'); return;
      }
      var validItems = w.items.filter(function (i) { return i.name.trim(); });
      if (!validItems.length) { showToast('위시 아이템을 최소 1개 이상 입력해주세요 (예: 런닝화)'); return; }
      // 목표금액/마감일에 0이나 음수를 넣으면(예: -5000) `Number(goal) || 1000`이 -5000을
      // 그대로 통과시켜(0이 아니라 truthy라서) 진행률 계산이 통째로 깨지는 아이템이 만들어졌다 -
      // 다음 단계로 못 넘어가게 여기서 미리 막는다. 목표 종류는 아이템마다 다를 수 있다.
      if (!validItems.every(function (i) { return i.goalType !== 'money' || Number(i.goal) >= 1000; })) { showToast('아이템 가격은 1,000원 이상으로 입력해주세요.'); return; }
      if (!validItems.every(function (i) { return i.goalType === 'money' || Number(i.goalCount) >= 1; })) { showToast('하트/댓글 목표 개수를 1개 이상으로 입력해주세요.'); return; }
      if (!(Number(w.days) >= 1)) { showToast('마감일은 1일 이상으로 입력해주세요.'); return; }
    }
    w.step = w.step + 1;
    render();
  };
  window.wizardPrevStep = function () {
    var w = state.ui.createWizard;
    w.step = Math.max(1, w.step - 1);
    render();
  };

  window.finishWizard = function () {
    var w = state.ui.createWizard;
    if (state.ui.creatingWish) return;
    var isGroup = w.wishType === 'group';
    state.ui.creatingWish = true;
    render();
    var items = w.items.filter(function (i) { return i.name.trim(); }).map(function (i) {
      var goalType = i.goalType === 'hearts' || i.goalType === 'comments' ? i.goalType : 'money';
      return {
        name: i.name.trim(), link: (i.link || '').trim(), image_urls: i.imageUrls || [], note: (i.note || '').trim(), pledge: (i.pledge || '').trim(),
        goal_type: goalType,
        // `|| 1000`은 0/NaN만 걸러내고 음수는 그대로 통과시켜(-5000은 truthy) 진행률 계산을
        // 깨뜨렸던 지점 - wizardNextStep에서 이미 막고 있지만 여기서도 Math.max로 한 번 더 보장한다.
        goal_amount: goalType === 'money' ? Math.max(1000, Number(i.goal) || 1000) : 1000,
        goal_count: goalType === 'money' ? null : Math.max(1, Number(i.goalCount) || 1),
      };
    });
    fetch(API_BASE + '/api/wishes', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        owner_id: state.user.id, owner_name: state.user.name, owner_avatar: state.user.avatar,
        type: isGroup ? 'group' : 'personal', group_name: isGroup ? w.groupName.trim() : '',
        title: w.title.trim(), subtitle: w.subtitle.trim(), story: w.story.trim(), emoji: w.emoji, category: w.occasion,
        items: items, deadline: addDays(Math.max(1, Number(w.days) || 14)), is_private: !!w.isPrivate,
      }),
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        state.ui.creatingWish = false;
        if (!result.ok) { showToast(result.data.error || '위시 등록에 실패했어요.'); render(); return; }
        state.ui.createWizard = null;
        showToast(isGroup ? '✨ 단체 위시가 등록됐어요! 친구 초대 링크로 함께할 사람을 불러보세요' : '✨ 위시가 등록됐어요!');
        syncWishesFromServer();
      })
      .catch(function () {
        state.ui.creatingWish = false;
        showToast('네트워크 오류로 실패했어요. 다시 시도해주세요.');

      });
  };

  // ---- 카카오 로그인 (keongyu와 같은 서버-사이드 authorize 플로우) ----
  // KNOWN LIMITATION: 익명 상태에서 만든 위시는 anon id 소유라, 로그인 후 다른 id로 바뀌면
  // 그 위시들은 더 이상 "내 위시"로 삭제 권한을 못 갖는다 (keongyu의 creator 이름 이관과 달리,
  // 여기는 소유권 자체가 user_id 기준이라 마이그레이션이 더 크다) - 지금은 로그인 전에는 되도록
  // 위시를 만들지 않는 걸 권장하는 선에서 남겨둔다.
  window.loginWithKakao = function () {
    if (window.Kakao && Kakao.Auth && typeof Kakao.Auth.authorize === 'function') {
      Kakao.Auth.authorize({
        redirectUri: KAKAO_OAUTH_REDIRECT_URI,
        scope: 'profile_nickname,profile_image',
        // 로그인 게이트 때문에 단체 위시 초대 링크(?join=)를 열자마자 로그인부터 해야 하니,
        // 돌아올 때 그 쿼리스트링을 잃지 않게 그대로 들고 간다 (kakao.ts가 프론트로 되돌려줄

        state: encodeURIComponent(location.origin + location.pathname + location.search),
      });
    } else {
      showToast('카카오 SDK를 불러오지 못했어요. 잠시 후 다시 시도해주세요.');

  window.logoutFromKakao = function () {

    // 로그인 게이트가 다시 뜨는 동안 화면엔 안 보이지만, 다른 사람 위시/알림이 메모리에
    // 그대로 남아있을 이유가 없다 - 다음 로그인 때 서버에서 다시 받아온다.
    state.wishes = [];

    state.ui.chatWishId = null;
    saveState();
    render();
    showToast('로그아웃했어요. 👋');

  // Kakao.Auth.authorize() 리다이렉트가 wishboard-api를 거쳐 돌아올 때 URL 해시에 실려오는
  // #kakao_login=<base64> 결과를 파싱해 state.user에 반영한다. 부팅 시 한 번 호출된다.
  function applyKakaoLoginResult() {
    var m = /kakao_login=([^&]+)/.exec(window.location.hash);
    if (!m) return;
    history.replaceState(null, '', window.location.pathname + window.location.search);
    try {
      var binary = atob(decodeURIComponent(m[1]));
      var bytes = Uint8Array.from(binary, function (c) { return c.charCodeAt(0); });
      var payload = JSON.parse(new TextDecoder().decode(bytes));
      if (payload.error) {
        console.error('[카카오 로그인 실패]', JSON.stringify(payload));
        showToast('카카오 로그인에 실패했어요. (' + payload.error + ')');
        return;
      }
      Object.assign(state.user, {
        id: payload.userId,
        name: payload.nickname,
        avatar: '😊',
        provider: 'kakao',
        kakaoProfileImage: payload.profileImage || null,
      });
      if (window.Kakao && Kakao.Auth && typeof Kakao.Auth.setAccessToken === 'function' && payload.accessToken) {
        Kakao.Auth.setAccessToken(payload.accessToken);
      }
      saveState();
      showToast('환영해요, ' + esc(payload.nickname) + '님! 👋');
    } catch (e) {
      showToast('카카오 로그인 처리 중 오류가 발생했어요.');
    }
  }

  // 읽음 처리만 하고 끝나서, "OO님이 OO에 5,000원 보탰어요" 알림을 눌러도 정작 그 위시로
  // 갈 방법이 없었다 - wishId가 있으면 상세 화면까지 열어준다.
  window.markNotifRead = function (id) {
    var n = state.notifications.filter(function (x) { return x.id === id; })[0];
    if (!n) return;
    n.read = true;
    saveState();
    if (n.type === 'chat_message' && n.wishId && state.wishes.some(function (w) { return w.id === n.wishId; })) {
      openChat(n.wishId);
    } else if (n.wishId && state.wishes.some(function (w) { return w.id === n.wishId; })) {
      openWishDetail(n.wishId);
    } else {
      render();
    }
  };
  window.deleteNotification = function (id) {
    fetch(API_BASE + '/api/notifications/' + encodeURIComponent(id) + '?user_id=' + encodeURIComponent(state.user.id), { method: 'DELETE' })
      .then(function (res) { return res.ok ? res.json() : Promise.reject(new Error('delete failed')); })
      .then(function () {
        state.notifications = state.notifications.filter(function (n) { return n.id !== id; });
        saveState();
        render();
      })
      .catch(function () { showToast('알림 삭제에 실패했어요.'); });
  };
  window.clearAllNotifications = function () {
    if (!state.notifications.length) return;
    if (!confirm('알림을 모두 지울까요?')) return;
    fetch(API_BASE + '/api/notifications?user_id=' + encodeURIComponent(state.user.id), { method: 'DELETE' })
      .then(function (res) { return res.ok ? res.json() : Promise.reject(new Error('delete failed')); })
      .then(function () {
        state.notifications = [];
        saveState();
        render();
      })
      .catch(function () { showToast('알림 삭제에 실패했어요.'); });

  // path 유틸 (텍스트 입력 상태 동기화용)
  function setStateAtPath(path, value) {
    var parts = path.split('.');
    var obj = state;
    for (var i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
    obj[parts[parts.length - 1]] = value;
  }

  // ============ AI 선물 추천 엔진 (규칙 기반 5차원 스코어링) ============
  // 실제 사용자에게는 "친구 관심사" 같은 데이터가 없어서(친구 그래프 자체가 없음), 예전 버전의
  // 5차원 중 "취향 일치도" 차원은 뺐다 - 있지도 않은 데이터로 가짜 매칭을 하는 것보다, 실제로
  // 있는 신호(진행도/과거 선물/타이밍) 3가지로 정직하게 계산하는 쪽을 택했다.
  function computeMyGiftStats() {
    var gifts = [];
    state.wishes.forEach(function (w) {
      (w.contributions || []).forEach(function (c) {
        if (c.fromUserId === state.user.id) {
          // 자기 위시에 스스로 보탠 경우 "나님께"처럼 어색해지니 이름 대신 "내 위시"라고 표시한다.
          var toName = w.ownerId === state.user.id ? '내 위시' : w.ownerName;
          gifts.push({ wishId: w.id, wishTitle: w.title, toName: toName, isSelf: w.ownerId === state.user.id, category: w.category, amount: c.amount, at: c.at });
        }
      });
    });
    gifts.sort(function (a, b) { return new Date(b.at) - new Date(a.at); });
    return gifts;
  }

  // ============ Render templates ============
  function renderApp() {
    // 로그인 전엔 위시 내용을 아예 볼 수 없게 한다 - 로그아웃 상태로 돌아가도(provider가
    // 'anon'이 되면) 여기서 바로 걸려 로그인 게이트만 보인다.
    if (state.user.provider !== 'kakao') return renderLoginGate();
    var html = '';
    html += renderTopbar();
    if (state.ui.tab === 'home') html += renderHome();
    else if (state.ui.tab === 'notif') html += renderNotifications();
    else if (state.ui.tab === 'my') html += renderMyPage();
    html += renderBottomNav();
    if (state.ui.tab === 'home') html += '<button id="fab" onclick="openCreateWizard()">+</button>';
    if (state.ui.wishDetailId) html += renderWishDetailSheet();
    if (state.ui.chatWishId) html += renderChatPage();
    if (state.ui.createWizard) html += renderCreateWizard();
    if (state.ui.customizeOpen) html += renderCustomizeSheet();
    if (state.ui.avatarPickerOpen) html += renderAvatarPicker();
    if (state.ui.imageViewer) html += renderImageViewer();
    if (state.ui.toast) html += '<div id="cheer-toast">🔔 ' + esc(state.ui.toast) + '</div>';
    return '<div id="app-frame">' + html + '</div>';
  }

  function ddayBadge(deadline) {
    var d = daysUntil(deadline);
    if (!state.customization.widgets.dday) return '';
    var label = d < 0 ? '마감 지남' : d === 0 ? '오늘 마감' : 'D-' + d;
    return '<span class="dday' + (d <= 10 ? ' urgent' : '') + '">' + label + '</span>';
  }

  // 카드 우측에 얹는 작은 달성률 도넛 링 위젯 - conic-gradient로 채우고 가운데를 배경색 원으로
  // 덮어 링 모양을 낸다(실제 SVG 없이 CSS만으로).
  function gaugeRingHtml(pct) {
    if (!state.customization.widgets.gaugeRing) return '';
    return '<div class="gauge-ring" style="background: conic-gradient(var(--primary) ' + pct + '%, #F0EEE7 0);"><div class="gauge-ring-inner">' + pct + '%</div></div>';
  }

  // "최근 응원 롤링 토스트" 위젯 - 전체 위시의 최근 기여 5건을 모아 몇 초마다 하나씩 돌려 보여준다.
  function collectRecentCheers() {
    var items = [];
    state.wishes.forEach(function (w) {
      (w.contributions || []).forEach(function (c) {
        items.push({ fromName: c.fromName, amount: c.amount, wishTitle: w.title, at: c.at });
      });
    });
    items.sort(function (a, b) { return b.at - a.at; });
    return items.slice(0, 5);
  }

  function cheerTickerHtml() {
    if (!state.customization.widgets.cheerToast) return '';
    var recent = collectRecentCheers();
    if (!recent.length) return '';
    var idx = (state.ui.cheerTickerIndex || 0) % recent.length;
    var c = recent[idx];
    return '<div class="cheer-ticker">💛 ' + esc(c.fromName) + '님이 "' + esc(c.wishTitle) + '"에 ' + formatWon(c.amount) + ' 보탰어요</div>';
  }

  // 후원한 사람 수 - "N명 참여" 뱃지와 급상승 정렬 둘 다에 쓴다. followerCount(찜)와는 다른
  // 지표라 헷갈리지 않게 이름을 분명히 뒀다.
  function uniqueBackerCount(wish) {
    var seen = {};
    (wish.contributions || []).forEach(function (c) { if (c.fromUserId) seen[c.fromUserId] = true; });
    return Object.keys(seen).length;
  }

  // 위시의 "목표"가 금액(기존)뿐 아니라 하트수(관심 등록 수)/댓글수일 수도 있다 - goal_type이
  // 무엇이든 카드/상세가 똑같은 방식으로 진행률 바를 그릴 수 있게 여기서 한 번에 계산해준다.
  // wish.progress는 서버가 계산해서 내려주는데, 혹시 없는(예전 캐시) 경우를 대비해 금액
  // 기준으로 직접 계산하는 fallback도 둔다.
  // wish나 item이나 똑같은 모양(progress: {pct, type, current, target})을 서버가 내려주므로
  // 카드/상세 양쪽에서 똑같은 방식으로 진행률 바를 그릴 수 있다. wish는 아이템마다 목표
  // 종류가 다를 수 있어 progress.type이 'mixed'일 수도 있다(아이템 목표 종류가 안 섞여있으면
  // 그 하나의 종류를 그대로 쓴다) - 이땐 금액/개수를 못 더하니 "완료한 아이템 수"만 보여준다.
  function goalProgress(obj) {
    var p = obj.progress || {
      current: obj.currentAmount, target: obj.goalAmount, type: 'money',
      pct: obj.goalAmount > 0 ? Math.min(100, Math.round((obj.currentAmount / obj.goalAmount) * 100)) : 0,
    };
    if (p.type === 'hearts') return { pct: p.pct, icon: '❤️', amtText: Number(p.current || 0).toLocaleString() + ' / ' + Number(p.target || 0).toLocaleString() + '명' };
    if (p.type === 'comments') return { pct: p.pct, icon: '💬', amtText: Number(p.current || 0).toLocaleString() + ' / ' + Number(p.target || 0).toLocaleString() + '개' };
    if (p.type === 'mixed') return { pct: p.pct, icon: '🎯', amtText: '아이템 ' + (p.completedItems || 0) + ' / ' + (p.totalItems || 0) + '개 달성' };
    return { pct: p.pct, icon: '💰', amtText: formatWon(p.current) + ' / ' + formatWon(p.target) };
  }

  function wishCardHtml(wish) {
    var progress = goalProgress(wish);
    var pct = progress.pct;
    var backers = uniqueBackerCount(wish);
    var cardCls = 'wish-card style-' + state.customization.cardStyle;
    var followBtn = '' +
      '<button class="icon-btn" style="width:26px; height:26px; font-size:13px; flex-shrink:0;" onclick="event.stopPropagation(); toggleFollow(\'' + wish.id + '\', ' + (wish.following ? 'true' : 'false') + ')">' +
        (wish.following ? '❤️' : '🤍') +
      '</button>';
    return '' +
      '<div class="' + cardCls + '" onclick="openWishDetail(\'' + wish.id + '\')">' +
        '<div class="row-top">' +
          wishAvatarHtml(wish, 30) +
          '<div class="owner">' + (wish.type === 'group' ? '👥 ' : '') + wishOwnerLabel(wish) + '</div>' +
          gaugeRingHtml(pct) +
          ddayBadge(wish.deadline) +
          followBtn +
        '</div>' +
        '<div class="title">' + wish.emoji + ' ' + esc(wish.title) + (wish.isPrivate ? ' 🔒' : '') + '</div>' +
        '<div class="subtitle">' + esc(wish.subtitle) + '</div>' +
        '<div class="gauge-track"><div class="gauge-fill" style="width:' + pct + '%;"></div><div class="gauge-tick"></div></div>' +
        '<div class="stat-row"><span class="pct">' + progress.icon + ' ' + pct + '% 달성' + (backers ? ' · 🎉 ' + backers + '명 참여' : '') + '</span><span class="amt">' + progress.amtText + '</span></div>' +
      '</div>';
  }

  function renderHome() {
    var query = (state.ui.homeSearch || '').trim().toLowerCase();
    var isTrending = state.ui.categoryFilter === 'trending';
    var filtered = state.wishes.filter(function (w) {
      if (!isTrending && state.ui.categoryFilter !== 'all' && w.category !== state.ui.categoryFilter) return false;
      if (!query) return true;
      return (w.title || '').toLowerCase().indexOf(query) >= 0 ||
        (w.subtitle || '').toLowerCase().indexOf(query) >= 0 ||
        wishOwnerLabel(w).toLowerCase().indexOf(query) >= 0;
    });
    // 급상승 = 후원자 수 많은 순 정렬 (와디즈/텀블벅의 인기 랭킹과 같은 개념) - 별도
    // "인기도" 점수 없이 지금 데이터(기여 목록)만으로 바로 계산할 수 있다.
    if (isTrending) {
      filtered = filtered.slice().sort(function (a, b) { return uniqueBackerCount(b) - uniqueBackerCount(a); });
    }
    var searchBar = '<div style="padding:0 16px 8px;">' +
      '<input id="home-search-input" type="text" placeholder="🔍 위시 제목, 소개, 만든 사람 검색" value="' + esc(state.ui.homeSearch) + '" oninput="onHomeSearchInput(this)" ' +
        'style="width:100%; padding:11px 14px; border:1px solid var(--border); border-radius:12px; background:var(--card); font-size:13.5px;" />' +
      '</div>';
    var chips = CATEGORY_FILTERS.map(function (c) {
      return '<button class="chip' + (state.ui.categoryFilter === c.type ? ' active' : '') + '" onclick="setCategoryFilter(\'' + c.type + '\')">' + esc(c.label) + '</button>';
    }).join('');
    var cards = state.ui.loading
      ? '<div class="empty-state">⏳<br/>위시 불러오는 중...</div>'
      : (filtered.length ? filtered.map(wishCardHtml).join('') : query
          ? '<div class="empty-state">🔍<br/>검색 결과가 없어요</div>'
          : '<div class="empty-state">🎁<br/>이 카테고리엔 아직 위시가 없어요<br/>+ 버튼으로 첫 위시를 만들어보세요!</div>');
    return cheerTickerHtml() + searchBar + '<div class="scroll-x">' + chips + '</div>' + cards;
  }

  function renderNotifications() {
    if (!state.notifications.length) return '<div class="empty-state">🔔<br/>아직 알림이 없어요</div>';
    var icons = { gift_arrived: '🎉', gift_rejected: '↩️', thank_you: '💌', wish_update: '📣', dday_soon: '⏰', cheer_comment: '💬', chat_message: '💬' };
    var clearAllRow = '<div style="display:flex; justify-content:flex-end; padding:10px 16px 0;"><button onclick="clearAllNotifications()" style="background:none; border:none; color:var(--text-sub); font-size:12px; font-weight:700; cursor:pointer;">모두 지우기</button></div>';
    return clearAllRow + state.notifications.map(function (n) {
      return '' +
        '<div class="notif-item' + (n.read ? '' : ' unread') + '">' +
          '<div class="ic" onclick="markNotifRead(\'' + n.id + '\')">' + (icons[n.type] || '🔔') + '</div>' +
          '<div class="txt" style="flex:1;" onclick="markNotifRead(\'' + n.id + '\')">' + esc(n.text) + '<div class="time">' + timeAgo(n.at) + '</div></div>' +
          '<button class="icon-btn" style="width:24px; height:24px; font-size:11px; flex-shrink:0;" onclick="deleteNotification(\'' + n.id + '\')">✕</button>' +
        '</div>';
    }).join('');
  }

  function timeAgo(ts) {
    var diff = Date.now() - new Date(ts).getTime();
    var h = Math.floor(diff / 3600000);
    if (h < 1) return '방금 전';
    if (h < 24) return h + '시간 전';
    return Math.floor(h / 24) + '일 전';
  }

  // 마이페이지 프로필 아바타 - 누르면 아이콘(이모지 캐릭터/사진) 바꾸는 시트가 뜬다는 걸
  // 알 수 있게 카메라 배지를 겹쳐 보여준다.
  function myAvatarHtml(sizePx) {
    var s = sizePx;
    var badge = Math.round(s * 0.34);
    return '' +
      '<div onclick="openAvatarPicker()" style="position:relative; width:' + s + 'px; height:' + s + 'px; cursor:pointer; flex-shrink:0;">' +
        '<div class="avatar" style="width:100%; height:100%; font-size:' + Math.round(s * 0.5) + 'px;">' + avatarContentHtml(state.user.avatar) + '</div>' +
        '<div style="position:absolute; bottom:-2px; right:-2px; width:' + badge + 'px; height:' + badge + 'px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center; font-size:' + Math.round(badge * 0.55) + 'px; border:2px solid var(--card);">📷</div>' +
      '</div>';
  }

  function renderMyPage() {
    var myGifts = computeMyGiftStats();
    var totalAmount = myGifts.reduce(function (s, g) { return s + g.amount; }, 0);
    var myWishes = state.wishes.filter(isWishMine);
    var layout = state.customization.profileLayout;
    // 익명 신원이라 "나"라는 이름 그대로면 다른 사람이 나를 못 알아본다 - 이름을 직접 정할 수
    // 있게 한다 (여기서 정한 이름이 내가 만드는 위시/보내는 선물에 그대로 붙어 나간다).
    var nameBlock = state.ui.editingProfile
      ? '<input id="profile-name-input" type="text" value="' + esc(state.user.name) + '" maxlength="16" style="font-size:16px; font-weight:900; width:140px;" />' +
        '<button class="icon-btn" style="width:26px; height:26px; font-size:12px;" onclick="saveProfileName()">✓</button>'
      : '<div style="font-size:16px; font-weight:900;">' + esc(state.user.name) + '</div>' +
        '<button class="icon-btn" style="width:26px; height:26px; font-size:11px;" onclick="startEditProfile()">✏️</button>';
    var head = layout === 'avatar'
      ? '<div style="text-align:center; padding:24px 16px 8px;">' + myAvatarHtml(72) + '<div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-top:6px;">' + nameBlock + '</div></div>'
      : '<div style="display:flex; align-items:center; gap:12px; padding:20px 16px 8px;">' + myAvatarHtml(52) + '<div style="display:flex; align-items:center; gap:6px;">' + nameBlock + '</div></div>';
    // 로그인 게이트 때문에 마이페이지에 도달했다는 건 이미 카카오 로그인 상태라는 뜻이라,
    // 예전에 있던 "로그인 안 했을 때" 분기는 더는 도달할 일이 없다.
    var kakaoBlock = '<div style="display:flex; align-items:center; gap:6px; padding:0 16px 16px;"><span class="chip" style="background:#FEE500; color:#3C1E1E;">💬 카카오 계정</span><button class="chip" onclick="logoutFromKakao()" style="background:none; border:1px solid var(--border); color:var(--text-sub);">로그아웃</button></div>';
    var statCards = '' +
      '<div style="display:flex; gap:10px; padding:0 16px 16px;">' +
        '<div style="flex:1; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; text-align:center;"><div style="font-size:11px; color:var(--text-sub); font-weight:700;">보낸 선물</div><div style="font-size:18px; font-weight:900; margin-top:4px; font-variant-numeric:tabular-nums;">' + myGifts.length + '건</div></div>' +
        '<div style="flex:1; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; text-align:center;"><div style="font-size:11px; color:var(--text-sub); font-weight:700;">보낸 금액</div><div style="font-size:18px; font-weight:900; margin-top:4px; font-variant-numeric:tabular-nums;">' + formatWon(totalAmount) + '</div></div>' +
      '</div>';
    var myWishSection = '<div style="padding:0 16px 6px; font-size:13px; font-weight:900;">내 위시 (' + myWishes.length + ')</div>' +
      (myWishes.length ? myWishes.map(wishCardHtml).join('') : '<div class="empty-state">아직 만든 위시가 없어요<br/>홈에서 + 버튼을 눌러보세요</div>');
    var followedWishes = state.wishes.filter(function (w) { return w.following; });
    var followedSection = followedWishes.length
      ? '<div style="padding:14px 16px 6px; font-size:13px; font-weight:900;">❤️ 관심 위시 (' + followedWishes.length + ')</div>' + followedWishes.map(wishCardHtml).join('')
      : '';
    var historyRows = myGifts.length
      ? myGifts.slice(0, 20).map(function (g) {
          return '<div class="cheer-item" style="padding:9px 16px;"><span class="who">' + esc(g.toName) + (g.isSelf ? '에' : '님께') + '</span><span class="msg">' + esc(g.wishTitle) + '</span><span class="amt">' + formatWon(g.amount) + '</span></div>';
        }).join('')
      : '';
    var historySection = myGifts.length ? '<div style="padding:14px 0 4px 16px; font-size:13px; font-weight:900;">보낸 선물 히스토리</div>' + historyRows : '';
    return head + kakaoBlock + statCards + myWishSection + followedSection + historySection;
  }

  function renderBottomNav() {
    var tabs = [
      { id: 'home', ic: '🏠', label: '홈' },
      { id: 'notif', ic: '🔔', label: '알림' },
      { id: 'my', ic: '👤', label: '마이' },
    ];
    return '<div id="bottom-nav">' + tabs.map(function (t) {
      return '<button class="nav-btn' + (state.ui.tab === t.id ? ' active' : '') + '" onclick="setTab(\'' + t.id + '\')"><span class="ic">' + t.ic + '</span>' + t.label + '</button>';
    }).join('') + '</div>';
  }

  function renderWishDetailSheet() {
    var wish = state.wishes.filter(function (w) { return w.id === state.ui.wishDetailId; })[0];
    if (!wish) return '';
    var draft = state.ui.giftDraft;
    var progress = goalProgress(wish);
    var pct = progress.pct;
    var isMine = isWishMine(wish);
    var ed = state.ui.editWishDraft;
    var editing = ed && ed.id === wish.id;
    var amounts = [1000, 3000, 5000, 10000, 50000];
    // "응원 방명록"은 원래 선물(돈)에 딸린 메시지뿐이었는데, goal_type='comments' 목표(댓글수)를
    // 위해 돈 없이 남기는 댓글(wish.comments)이 생겼다 - 방명록엔 둘을 시간순으로 합쳐서 보여준다.
    var timelineEntries = wish.contributions.map(function (c) { return { kind: 'gift', at: c.at, data: c }; })
      .concat((wish.comments || []).map(function (cm) { return { kind: 'comment', at: cm.at, data: cm }; }))
      .sort(function (a, b) { return new Date(b.at) - new Date(a.at); });
    var timeline = timelineEntries.length
      ? timelineEntries.map(function (entry) {
          if (entry.kind === 'comment') {
            var cm = entry.data;
            var canDeleteComment = cm.fromUserId && cm.fromUserId === state.user.id;
            return '<div class="cheer-item"><span class="who">' + esc(cm.fromName) + '</span><span class="msg">' + esc(cm.text) + '</span>' +
              (canDeleteComment ? '<button onclick="deleteWishComment(\'' + wish.id + '\', \'' + cm.id + '\')" style="background:none; border:none; color:var(--text-sub); font-size:10.5px; padding:2px 0 2px 6px; cursor:pointer; white-space:nowrap;">삭제</button>' : '') +
            '</div>';
          }
          var c = entry.data;
          var thanked = !!state.ui.thankedContributions[c.id];
          return '<div class="cheer-item"><span class="who">' + esc(c.fromName) + '</span><span class="msg">' + esc(c.message || '') + '</span><span class="amt">' + formatWon(c.amount) + '</span>' +
            (isMine ? '' +
              '<button onclick="sendThankYou(\'' + wish.id + '\', \'' + c.id + '\')" ' + (thanked ? 'disabled' : '') + ' style="background:none; border:none; color:' + (thanked ? 'var(--text-sub)' : 'var(--primary)') + '; font-size:10.5px; padding:2px 0 2px 6px; cursor:' + (thanked ? 'default' : 'pointer') + '; white-space:nowrap;">' + (thanked ? '💌 전송됨' : '💌 고마워요') + '</button>' +
              '<button onclick="rejectGift(\'' + wish.id + '\', \'' + c.id + '\')" style="background:none; border:none; color:var(--danger); font-size:10.5px; padding:2px 0 2px 6px; cursor:pointer; white-space:nowrap;">거절</button>'
              : '') +
          '</div>';
        }).join('')
      : '<div style="font-size:12px; color:var(--text-sub); padding:8px 0;">아직 응원이 없어요, 첫 번째로 남겨보세요!</div>';
    var commentForm = '' +
      '<div style="display:flex; gap:6px; margin-top:4px;">' +
        '<input type="text" id="wish-comment-input" placeholder="응원 댓글 남기기 (선물 없이도 OK)" value="' + esc(state.ui.wishCommentDraft) + '" oninput="setWishCommentDraft(this)" style="flex:1;" />' +
        '<button class="btn-ghost" style="width:auto; padding:0 14px;" onclick="sendWishComment(\'' + wish.id + '\')">등록</button>' +
      '</div>';
    // GoFundMe의 실시간 후원 티커처럼, 방금 있었던 활동을 상단에 눈에 띄게 보여준다(전체
    // 목록 하단의 방명록과 별개) - 활동이 없으면 굳이 안 보여준다.
    var latestActivity = timelineEntries[0];
    var activityBanner = latestActivity
      ? (latestActivity.kind === 'gift'
          ? '<div style="background:#FFFBEF; border-radius:10px; padding:8px 12px; font-size:12px; font-weight:700; color:var(--text-sub); margin-top:2px;">💛 ' + esc(latestActivity.data.fromName) + '님이 ' + formatWon(latestActivity.data.amount) + ' 보탰어요 · ' + timeAgo(latestActivity.at) + '</div>'
          : '<div style="background:#FFFBEF; border-radius:10px; padding:8px 12px; font-size:12px; font-weight:700; color:var(--text-sub); margin-top:2px;">💬 ' + esc(latestActivity.data.fromName) + '님이 댓글을 남겼어요 · ' + timeAgo(latestActivity.at) + '</div>')
      : '';

    // 선물은 위시 전체가 아니라 그 안의 아이템 하나(예: "런닝화")를 향한다 - 아이템별로
    // 이미지·상품 링크·진행률을 보여주고, "선물하기"를 누른 아이템 밑에만 금액 입력 폼이
    // 펼쳐진다(draft.itemId로 어느 아이템이 펼쳐져 있는지 추적).
    var itemEd = state.ui.editItemDraft;
    function itemBlockHtml(item) {
      var itemProgress = goalProgress(item);
      var itemPct = itemProgress.pct;
      var thumb = (item.imageUrls && item.imageUrls.length)
        ? '<img src="' + esc(item.imageUrls[0]) + '" onclick="event.stopPropagation(); openImageViewer(\'' + wish.id + '\', \'' + item.id + '\', 0)" style="width:48px; height:48px; border-radius:10px; object-fit:cover; flex-shrink:0; background:#F0EEE7; cursor:pointer;" />'
        : '<div style="width:48px; height:48px; border-radius:10px; background:#F0EEE7; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;">🎁</div>';
      var linkHtml = item.link ? '<a href="' + esc(item.link) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-size:11px; color:var(--text-sub); text-decoration:underline;">상품 보러가기 ↗</a>' : '';
      var isOpen = draft && draft.itemId === item.id;
      var isEditingItem = itemEd && itemEd.itemId === item.id;

      if (isEditingItem) {
        return '' +
          '<div style="border:1px dashed var(--border); border-radius:14px; padding:12px; margin-bottom:8px; display:flex; flex-direction:column; gap:6px;" onclick="event.stopPropagation()">' +
            '<input type="text" placeholder="아이템 이름 *" value="' + esc(itemEd.name) + '" maxlength="80" required oninput="setEditItemField(\'name\', this)" />' +
            '<input type="text" placeholder="상품 링크 주소 (선택)" value="' + esc(itemEd.link) + '" oninput="setEditItemField(\'link\', this)" />' +
            imageManagerHtml(itemEd.imageUrls, 'removeEditItemImage(', 'pickEditItemImage(this)', 'addEditItemImageUrl(this)') +
            '<div style="display:flex; gap:6px;">' + GOAL_TYPES.map(function (g) {
              return '<button type="button" class="chip' + ((itemEd.goalType || 'money') === g.type ? ' active' : '') + '" onclick="setEditItemGoalType(\'' + g.type + '\')">' + g.emoji + ' ' + g.label + '</button>';
            }).join('') + '</div>' +
            ((itemEd.goalType || 'money') === 'money'

  // ---- 아이템 사진 크게 보기 (핀치줌/좌우 스와이프 캐러셀, 최대 5장) ----
  window.openImageViewer = function (wishId, itemId, index) {
    state.ui.imageViewer = { wishId: wishId, itemId: itemId, index: index || 0 };

  };
  window.closeImageViewer = function () { state.ui.imageViewer = null; render(); };
  function imageViewerUrls() {
    var v = state.ui.imageViewer;
    if (!v) return [];
    var wish = state.wishes.filter(function (w) { return w.id === v.wishId; })[0];
    var item = wish && (wish.items || []).filter(function (i) { return i.id === v.itemId; })[0];
    return (item && item.imageUrls) || [];
  }
  window.imageViewerGoTo = function (delta) {
    var v = state.ui.imageViewer;
    var urls = imageViewerUrls();
    if (!v || !urls.length) return;
    v.index = (v.index + delta + urls.length) % urls.length;
    render();
  };
  function renderImageViewer() {
    var v = state.ui.imageViewer;
    if (!v) return '';
    var urls = imageViewerUrls();
    if (!urls.length) { state.ui.imageViewer = null; return ''; }
    var idx = Math.max(0, Math.min(v.index, urls.length - 1));
    return '' +
      '<div id="image-viewer" onclick="if (event.target.id === \'image-viewer\') closeImageViewer()">' +
        '<div style="display:flex; justify-content:space-between; align-items:center; padding:12px 16px;">' +
          '<span style="color:#fff; font-size:12px; font-weight:800;">' + (urls.length > 1 ? (idx + 1) + ' / ' + urls.length : '') + '</span>' +
          '<button onclick="closeImageViewer()" style="background:none; border:none; color:#fff; font-size:22px; cursor:pointer; padding:4px;">✕</button>' +
        '</div>' +
        '<div id="image-viewer-stage">' +
          (urls.length > 1 ? '<button class="iv-nav" style="left:8px;" onclick="imageViewerGoTo(-1)">‹</button>' : '') +
          '<img id="image-viewer-img" src="' + esc(urls[idx]) + '" draggable="false" />' +
          (urls.length > 1 ? '<button class="iv-nav" style="right:8px;" onclick="imageViewerGoTo(1)">›</button>' : '') +
        '</div>' +

  // 핀치줌/드래그팬/스와이프는 포인터 이벤트로 직접 처리한다 - render()를 거치면(즉 state를
  // 바꿔 다시 그리면) 제스처 도중 DOM 노드가 통째로 교체되어 드래그가 뚝뚝 끊긴다. 그래서 확대
  // 배율/이동값은 state가 아니라 이 함수의 클로저 변수로만 들고, 사진이 바뀌거나(다음/이전)
  // 뷰어를 닫을 때만(=render()가 다시 불릴 때만) 이 함수가 다시 붙으며 초기화된다.
  function attachImageViewerGestures() {
    var img = document.getElementById('image-viewer-img');
    if (!img) return;
    var scale = 1, panX = 0, panY = 0;
    var pointers = {};
    var pinchStartDist = 0, pinchStartScale = 1;
    var dragStart = null, swipeStartX = null, swiped = false;

    function apply() { img.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')'; }
    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

    img.onpointerdown = function (e) {
      try { img.setPointerCapture(e.pointerId); } catch (err) {}
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pointers);
      if (ids.length === 2) {
        pinchStartDist = dist(pointers[ids[0]], pointers[ids[1]]);
        pinchStartScale = scale;
        dragStart = null;
      } else if (ids.length === 1) {
        dragStart = { x: e.clientX, y: e.clientY, panX: panX, panY: panY };
        swipeStartX = scale <= 1 ? e.clientX : null;
        swiped = false;
      }
    };
    img.onpointermove = function (e) {
      if (!pointers[e.pointerId]) return;
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pointers);
      if (ids.length === 2) {
        var d = dist(pointers[ids[0]], pointers[ids[1]]);
        scale = Math.min(4, Math.max(1, pinchStartScale * (d / pinchStartDist)));
        apply();
      } else if (ids.length === 1 && dragStart) {
        var dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
        if (scale > 1) {
          panX = dragStart.panX + dx;
          panY = dragStart.panY + dy;
          apply();
        } else if (swipeStartX != null && Math.abs(dx) > 8) {
          img.style.transform = 'translateX(' + dx + 'px)';
        }
      }
    };
    function endPointer(e) {
      var wasSwipe = pointers[e.pointerId] && Object.keys(pointers).length === 1 && scale <= 1 && swipeStartX != null;
      delete pointers[e.pointerId];
      if (Object.keys(pointers).length === 0) {
        if (wasSwipe && !swiped) {
          var dx = e.clientX - swipeStartX;
          if (Math.abs(dx) > 60) { swiped = true; imageViewerGoTo(dx < 0 ? 1 : -1); return; }
          apply(); // 스와이프 문턱 못 넘었으면 제자리로
        }
        dragStart = null; swipeStartX = null;
      }
    }
    img.onpointerup = endPointer;
    img.onpointercancel = endPointer;
    img.ondblclick = function () {
      scale = scale > 1 ? 1 : 2.5; panX = 0; panY = 0; apply();
    };
    img.onwheel = function (e) {
      e.preventDefault();
      scale = Math.min(4, Math.max(1, scale - e.deltaY * 0.01));
      if (scale <= 1) { scale = 1; panX = 0; panY = 0; }
      apply();
    };
  }

      ? '<div class="empty-state">⏳<br/>불러오는 중...</div>'
      : (messages.length ? messages.map(function (m) {
          var mine = m.fromUserId === state.user.id;
          return '' +
            '<div style="display:flex; flex-direction:column; align-items:' + (mine ? 'flex-end' : 'flex-start') + '; margin-bottom:8px;">' +
              (mine ? '' : '<div style="font-size:10.5px; font-weight:800; color:var(--text-sub); margin-bottom:2px; padding:0 4px;">' + esc(m.fromName) + '</div>') +
              '<div style="max-width:75%; padding:9px 12px; border-radius:14px; font-size:13px; line-height:1.4; word-break:break-word; background:' + (mine ? 'var(--primary)' : 'var(--card)') + '; color:' + (mine ? 'var(--primary-text)' : 'var(--text)') + '; border:' + (mine ? 'none' : '1px solid var(--border)') + ';">' + esc(m.text) + '</div>' +
              (mine ? '<button onclick="deleteChatMessage(\'' + m.id + '\')" style="background:none; border:none; color:var(--text-sub); font-size:10.5px; padding:2px 4px; cursor:pointer;">삭제</button>' : '') +

        }).join('') : '<div class="empty-state">💬<br/>첫 메시지를 보내보세요!</div>');

    return '' +
      '<div class="detail-page" style="z-index:120;">' +
        '<div class="sheet-head"><button class="icon-btn" onclick="closeChat()">←</button><h2>💬 ' + esc(wish.title) + '</h2><span style="width:34px;"></span></div>' +

          '<input id="chat-input" type="text" placeholder="메시지를 입력하세요" value="' + esc(state.ui.chatDraft) + '" oninput="setChatDraft(this)" style="flex:1;" />' +

          '<button type="button" class="template-card' + (w.wishType === 'group' ? ' active' : '') + '" onclick="setWizardType(\'group\')"><span class="emo">👥</span><span><div class="t">단체 위시</div><div class="s">친구들과 함께 만드는 위시예요</div></span></button>' +

        (w.wishType === 'group' ? '' +

        : '<div class="row-top"><div class="avatar">' + avatarContentHtml(state.user.avatar) + '</div><div class="owner">' + esc(state.user.name) + '님의 위시</div><span class="dday">D-' + w.days + '</span></div>';
      var previewItems = w.items.filter(function (i) { return i.name.trim(); });

      var previewTypes = previewItems.map(function (i) { return i.goalType === 'hearts' || i.goalType === 'comments' ? i.goalType : 'money'; });

      var previewIcon = !previewSameType ? '🎯' : previewTypes[0] === 'hearts' ? '❤️' : previewTypes[0] === 'comments' ? '💬' : '💰';

      body = '' +
        '<div class="wish-card style-' + state.customization.cardStyle + '" style="margin:0;">' +

          return '<div class="cheer-item"><span class="who">' + esc(i.name) + '</span><span class="amt">' + goalText + '</span></div>';
        }).join('') +
        '<div style="font-size:12px; color:var(--text-sub); text-align:center; margin-top:4px;">이렇게 등록돼요. 확인하고 완료를 눌러주세요!</div>';

      (w.step > 1 ? '<button class="btn-ghost" style="flex:1;" onclick="wizardPrevStep()">이전</button>' : '') +

  // IME(한글) 조합 이벤트 - oncompositionstart/end는 인라인 어트리뷰트로 등록해도 브라우저가
  // GlobalEventHandlers로 인식하지 않아 죽은 코드가 되므로 document에 위임한다. render()가
  // #root를 통째로 교체해 매번 새 입력창 노드가 생겨도 document 리스너는 유효하다. 홈 화면
  // 검색창도 15초 백그라운드 동기화 중 render()가 불릴 수 있어 같은 가드가 필요하다.
  document.addEventListener('compositionstart', function (e) {
    if (e.target && (e.target.id === 'wizard-story-input' || e.target.id === 'home-search-input' || e.target.id === 'chat-input' || e.target.id === 'wish-comment-input')) e.target.dataset.composing = 'true';
  });
  document.addEventListener('compositionend', function (e) {
    if (!e.target) return;
    if (e.target.id === 'wizard-story-input') {
      e.target.dataset.composing = 'false';
      window.wizardSetStory(e.target);
    } else if (e.target.id === 'home-search-input') {
      e.target.dataset.composing = 'false';
      window.onHomeSearchInput(e.target);
    } else if (e.target.id === 'chat-input') {
      e.target.dataset.composing = 'false';
      window.setChatDraft(e.target);
    } else if (e.target.id === 'wish-comment-input') {
      e.target.dataset.composing = 'false';
      window.setWishCommentDraft(e.target);
    }
  });

  // 채팅창이 열려있는 동안엔 4초마다 조용히 새 메시지를 받아온다(실시간 웹소켓 없이 폴링으로
  // "실시간"에 가깝게 흉내). 조합 중 render() 스킵은 render() 자체의 IME 가드가 처리한다.
  // 새 메시지가 실제로 없으면 render()를 아예 안 부른다 - .detail-page에 걸린 등장 애니메이션이
  // render()마다(즉 DOM을 새로 만들 때마다) 다시 재생돼서, 변경 없이도 4초마다 화면이 깜빡이는
  // 것처럼 보였다.
  setInterval(function () {
    if (!state.ui.chatWishId) return;
    fetch(API_BASE + '/api/wishes/' + encodeURIComponent(state.ui.chatWishId) + '/chat')
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        if (!data || state.ui.chatWishId === null) return;
        var next = data.messages || [];
        var prev = state.ui.chatMessages || [];
        var changed = next.length !== prev.length || (next.length && prev.length && next[next.length - 1].id !== prev[prev.length - 1].id);
        if (!changed) return;
        state.ui.chatMessages = next;
        render();
        var el = document.querySelector('.chat-scroll');
        if (el) el.scrollTop = el.scrollHeight;
      })
      .catch(function () {});
  }, 4000);

  // "최근 응원 롤링 토스트" 위젯 - 순수 홈 피드가 보이는 동안만 몇 초마다 다음 응원으로 돌린다.
  // 위시 상세/위저드/꾸미기 시트/대화방/사진 뷰어가 위에 떠 있을 때는 절대 render()를 부르지
  // 않는다 - 부르면 그 시트 안에서 타이핑 중인 입력창(id 없는 응원메시지, 채팅 알림으로
  // 대화방에 바로 들어온 경우의 chat-input 등)이 몇 초마다 포커스를 잃는 keongyu의 검색창
  // 버그와 같은 문제가 생기고, 사진 뷰어는 render()가 다시 붙을 때마다 확대/이동 상태가
  // 초기화된다(제스처는 state가 아니라 DOM에 직접 그리는 값이라 render()가 그 값을 모른다).
  setInterval(function () {
    if (!state.customization.widgets.cheerToast || state.ui.tab !== 'home') return;
    if (state.ui.wishDetailId || state.ui.createWizard || state.ui.customizeOpen || state.ui.chatWishId || state.ui.imageViewer) return;
    var recent = collectRecentCheers();
    if (recent.length < 2) return;
    state.ui.cheerTickerIndex = ((state.ui.cheerTickerIndex || 0) + 1) % recent.length;
    render();
  }, 4000);

  // "친구랑 같이 쓰는" 위시보드의 핵심은 다른 사람이 보탠 게 내 화면에도 보여야 한다는 건데,
  // 내가 직접 뭔가 하지 않는 한(위시 등록/보태기) 화면이 다시 서버를 조회할 일이 아예 없었다 -
  // 친구가 방금 보탠 걸 확인하려면 새로고침해야만 했다. 주기적으로 조용히 새로 받아온다.
  // 시트가 열려있을 때 건드리면 안 되는 이유는 위 인터벌과 같다.
  setInterval(function () {
    if (state.user.provider !== 'kakao') return;
    if (state.ui.wishDetailId || state.ui.createWizard || state.ui.customizeOpen || state.ui.chatWishId || state.ui.imageViewer) return;
    syncWishesFromServer();
  }, 15000);

  // 알림(예: 주인이 보낸 "후원자들에게 업데이트 보내기")은 정작 위시 상세를 보고 있는
  // 사람이 받아야 하는 경우가 많은데, 위 인터벌처럼 오버레이가 떠 있으면 통째로 막아두면
  // 그 화면을 벗어나기 전까진 영원히 못 받는다 - "1명에게 보냈다는데 알림이 안 뜬다"는
  // 버그가 바로 이 가드 때문이었다. 알림 목록은 오버레이 안에 그려지지 않으니 계속 받는다.
  setInterval(function () {
    if (state.user.provider !== 'kakao') return;
    syncNotificationsFromServer();
  }, 15000);

  applyKakaoLoginResult(); // 카카오 로그인 리다이렉트로 막 돌아온 경우, 첫 render 전에 신원부터 반영
  // 새로고침했거나 위시 상세 링크로 바로 들어온 경우 - 해시에 남아있는 #wish=id를 복원한다.
  (function () {
    var m = /#wish=([^&]+)/.exec(location.hash);
    if (m) state.ui.wishDetailId = m[1];
  })();
  render(); // 서버 응답 오기 전에도 "불러오는 중" 화면이 바로 보이게 먼저 한 번 그린다
  // 로그인 게이트가 막고 있는 동안엔 어차피 아무것도 안 보이니, 로그인 전엔 서버에
  // 데이터를 받아올 필요가 없다(단체 위시 초대 링크의 자동 합류도 로그인 후로 미룬다 -
  // loginWithKakao()가 현재 쿼리스트링을 그대로 들고 돌아오게 해뒀다).
  if (state.user.provider === 'kakao') {
    joinWishFromUrl();
    syncWishesFromServer();
    syncNotificationsFromServer();
  }
})();
</script>
</body>
</html>
