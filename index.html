  function renderBottomNav() {
    var tabs = [
      { id: 'home', ic: '🏠', label: '홈' },
      { id: 'explore', ic: '🧭', label: '탐색' },
      { id: 'notif', ic: '🔔', label: '알림' },
      { id: 'my', ic: '👤', label: '마이' },
    ];
    return '<div id="bottom-nav">' + tabs.map(function (t) {
      return '<button class="nav-btn' + (state.ui.tab === t.id ? ' active' : '') + '" onclick="setTab(\'' + t.id + '\')"><span class="ic">' + t.ic + '</span>' + t.label + '</button>';
    }).join('') + '</div>';
  }

  function renderWishDetailSheet() {
    var wish = state.wishes.filter(function (w) { return w.id === state.ui.wishDetailId; })[0];
    if (!wish) return '';
    var draft = state.ui.giftDraft;
    var pct = wish.goalAmount > 0 ? Math.min(100, Math.round((wish.currentAmount / wish.goalAmount) * 100)) : 0;
    var isMine = isWishMine(wish);
    var ed = state.ui.editWishDraft;
    var editing = ed && ed.id === wish.id;
    var amounts = [1000, 3000, 5000, 10000, 50000];
    var timeline = wish.contributions.length
      ? wish.contributions.map(function (c) {
          return '<div class="cheer-item"><span class="who">' + esc(c.fromName) + '</span><span class="msg">' + esc(c.message || '') + '</span><span class="amt">' + formatWon(c.amount) + '</span></div>';
        }).join('')
      : '<div style="font-size:12px; color:var(--text-sub); padding:8px 0;">아직 응원이 없어요, 첫 번째로 보태보세요!</div>';

    // 선물은 위시 전체가 아니라 그 안의 아이템 하나(예: "런닝화")를 향한다 - 아이템별로
    // 이미지·상품 링크·진행률을 보여주고, "선물하기"를 누른 아이템 밑에만 금액 입력 폼이
    // 펼쳐진다(draft.itemId로 어느 아이템이 펼쳐져 있는지 추적).
    var itemEd = state.ui.editItemDraft;
    var itemsHtml = (wish.items || []).map(function (item) {
      var itemPct = item.goalAmount > 0 ? Math.min(100, Math.round((item.currentAmount / item.goalAmount) * 100)) : 0;
      var thumb = item.imageUrl
        ? '<img src="' + esc(item.imageUrl) + '" style="width:48px; height:48px; border-radius:10px; object-fit:cover; flex-shrink:0; background:#F0EEE7;" />'
        : '<div style="width:48px; height:48px; border-radius:10px; background:#F0EEE7; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;">🎁</div>';
      var linkHtml = item.link ? '<a href="' + esc(item.link) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-size:11px; color:var(--text-sub); text-decoration:underline;">상품 보러가기 ↗</a>' : '';
      var isOpen = draft && draft.itemId === item.id;
      var isEditingItem = itemEd && itemEd.itemId === item.id;

      if (isEditingItem) {
        return '' +
          '<div style="border:1px dashed var(--border); border-radius:14px; padding:12px; margin-bottom:8px; display:flex; flex-direction:column; gap:6px;" onclick="event.stopPropagation()">' +
            '<input type="text" placeholder="아이템 이름 *" value="' + esc(itemEd.name) + '" oninput="setEditItemField(\'name\', this)" />' +
            '<input type="text" placeholder="상품 링크 주소 (선택)" value="' + esc(itemEd.link) + '" oninput="setEditItemField(\'link\', this)" />' +
            '<input type="text" placeholder="상품 이미지 URL (선택)" value="' + esc(itemEd.imageUrl) + '" oninput="setEditItemField(\'imageUrl\', this)" />' +
            '<input type="number" placeholder="가격(목표 금액, 원) *" value="' + esc(itemEd.goal) + '" oninput="setEditItemField(\'goal\', this)" />' +
            '<div style="display:flex; gap:8px;">' +
              '<button class="btn-ghost" style="flex:1;" onclick="cancelEditItem()">취소</button>' +
              '<button class="btn-primary" style="flex:1;" ' + (state.ui.savingEditItem ? 'disabled' : '') + ' onclick="saveEditItem()">' + (state.ui.savingEditItem ? '저장 중...' : '저장하기') + '</button>' +
            '</div>' +
          '</div>';
      }

      var giftHere = isOpen ? '' +
        '<div style="margin-top:8px; padding-top:8px; border-top:1px dashed var(--border);">' +
          '<div class="amount-grid">' + amounts.map(function (a) {
            return '<div class="amount-chip' + (draft.amount === a && !draft.customAmount ? ' active' : '') + '" onclick="pickGiftAmount(' + a + ')">' + (a >= 10000 ? (a / 10000) + '만' : a.toLocaleString()) + '</div>';
          }).join('') + '</div>' +
          '<input type="text" inputmode="numeric" placeholder="직접 입력 (원)" value="' + esc(draft.customAmount) + '" oninput="setCustomGiftAmount(this)" />' +
          '<textarea rows="2" placeholder="응원 한마디를 남겨보세요" oninput="setGiftMessage(this)">' + esc(draft.message) + '</textarea>' +
          '<div class="option-item' + (draft.anonymous ? ' active' : '') + '" onclick="toggleGiftAnonymous()"><span>🙈 익명으로 보내기</span><button class="toggle' + (draft.anonymous ? ' on' : '') + '"></button></div>' +
          '<div style="display:flex; gap:8px;">' +
            '<button class="btn-ghost" style="flex:1;" onclick="closeItemGift()">취소</button>' +
            '<button class="btn-primary" style="flex:2;" ' + (state.ui.sendingGift ? 'disabled' : '') + ' onclick="sendGift()">' + (state.ui.sendingGift ? '⏳ 보내는 중...' : '💛 카카오페이로 보태기') + '</button>' +
          '</div>' +
        '</div>' : '';

      var itemOwnerActions = isMine ? '' +
        '<div style="display:flex; gap:4px; flex-shrink:0;">' +
          '<button class="icon-btn" style="width:26px; height:26px; font-size:11px;" onclick="startEditItem(\'' + wish.id + '\', \'' + item.id + '\')">✏️</button>' +
          '<button class="icon-btn" style="width:26px; height:26px; font-size:11px;" onclick="deleteWishItem(\'' + wish.id + '\', \'' + item.id + '\')">🗑️</button>' +
        '</div>' : '';

      return '' +
        '<div style="border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:8px;" onclick="event.stopPropagation()">' +
          '<div style="display:flex; gap:10px;">' +
            thumb +
            '<div style="flex:1; min-width:0;">' +
              '<div style="font-size:13.5px; font-weight:800;">' + esc(item.name) + '</div>' +
              linkHtml +
              '<div class="gauge-track" style="margin-top:6px;"><div class="gauge-fill" style="width:' + itemPct + '%;"></div></div>' +
              '<div class="stat-row" style="margin-top:2px;"><span class="pct">' + itemPct + '%</span><span class="amt">' + formatWon(item.currentAmount) + ' / ' + formatWon(item.goalAmount) + '</span></div>' +
            '</div>' +
            itemOwnerActions +
          '</div>' +
          (!isOpen ? '<button class="btn-primary" style="width:100%; margin-top:8px;" onclick="openItemGift(\'' + item.id + '\')">💛 이 아이템에 선물하기</button>' : '') +
          giftHere +
        '</div>';
    }).join('');

    // isMine일 땐 내 위시라 남에게 선물 못 하니 빈 문자열이었는데, 그러면 정작 만든 위시를
    // 지울 방법이 하나도 없었다(데모 중에 테스트로 만든 위시가 계속 쌓이기만 함) - 삭제 버튼을 둔다.
    // 단체 위시면 친구 목록이 없는 대신 초대 링크로 서로를 불러야 하니 그 버튼도 같이 둔다.
    // 위시 전체 수정/삭제 버튼은 아이템별 수정/삭제(✏️/🗑️)가 생기면서 뺐다 - 사용자 요청.
    var ownerActions = (isMine && wish.type === 'group') ? '' +
      '<button class="btn-primary" style="margin-top:4px;" onclick="shareInviteViaKakao(\'' + wish.id + '\')">💬 카카오톡으로 초대하기</button>' +
      '<button class="btn-ghost" style="margin-top:4px;" onclick="copyInviteLink(\'' + wish.id + '\')">🔗 초대 링크 복사</button>'
      : '';

    var editForm = editing ? '' +
      '<input type="text" placeholder="위시 제목 *" value="' + esc(ed.title) + '" oninput="setEditWishField(\'title\', this)" />' +
      '<input type="text" placeholder="한 줄 소개" value="' + esc(ed.subtitle) + '" oninput="setEditWishField(\'subtitle\', this)" />' +
      '<input type="date" value="' + esc(ed.deadline) + '" oninput="setEditWishField(\'deadline\', this)" />' +
      '<textarea rows="4" placeholder="희망하는 이유" oninput="setEditWishField(\'story\', this)">' + esc(ed.story) + '</textarea>' +
      '<div style="display:flex; gap:8px; margin-top:4px;">' +
        '<button class="btn-ghost" style="flex:1;" onclick="cancelEditWish()">취소</button>' +
        '<button class="btn-primary" style="flex:1;" ' + (state.ui.savingWishEdit ? 'disabled' : '') + ' onclick="saveEditWish()">' + (state.ui.savingWishEdit ? '저장 중...' : '저장하기') + '</button>' +
      '</div>' : '';

    var addItemForm = isMine ? renderAddItemForm(wish.id) : '';
    // openChat()은 isWishMine()으로 owner인지 스스로 판단해서 owner면 대화 목록을, 방문자면
    // 바로 그 위시 주인과의 대화 스레드를 연다 - 버튼 문구만 상황에 맞게 바꿔서 보여준다.
    var chatEntry = isMine
      ? '<button class="btn-ghost" onclick="openChat(\'' + wish.id + '\')">💬 대화 목록 보기</button>'
      : '<button class="btn-ghost" onclick="openChat(\'' + wish.id + '\')">💬 ' + esc(wish.ownerName) + '님과 대화하기</button>';

    return '' +
      '<div class="detail-page">' +
        '<div class="sheet-head"><button class="icon-btn" onclick="closeWishDetail()">←</button><h2>' + wish.emoji + ' ' + esc(wish.title) + '</h2><span style="width:34px;"></span></div>' +
        '<div style="display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-sub);">' + wishAvatarHtml(wish, 26) + (wish.type === 'group' ? '👥 ' : '') + wishOwnerLabel(wish) + ' · ' + ddayBadge(wish.deadline) + '</div>' +
        (editing ? editForm : '' +
          (wish.story ? '<div style="font-size:12.5px; font-weight:800; color:var(--text-sub); margin-top:6px;">💭 희망하는 이유</div><div style="font-size:13px; line-height:1.6; white-space:pre-wrap;">' + esc(wish.story) + '</div>' : '') +
          '<div>' +
            '<div class="gauge-track"><div class="gauge-fill" style="width:' + pct + '%;"></div></div>' +
            '<div class="stat-row"><span class="pct">전체 ' + pct + '% 달성</span><span class="amt">' + formatWon(wish.currentAmount) + ' / ' + formatWon(wish.goalAmount) + '</span></div>' +
          '</div>' +
          '<div style="font-size:12.5px; font-weight:800; color:var(--text-sub); margin-top:8px;">🎁 위시 아이템 (' + (wish.items || []).length + ')</div>' +
          itemsHtml +
          addItemForm +
          chatEntry +
          ownerActions +
          '<div style="font-size:12.5px; font-weight:800; color:var(--text-sub); margin-top:6px;">💌 응원 방명록</div>' +
          '<div>' + timeline + '</div>') +
      '</div>';
  }

  // ---- 위시에 아이템 추가 (만든 사람만) ----
  function renderAddItemForm(wishId) {
    var d = state.ui.addItemDraft;
    if (!d || d.wishId !== wishId) {
      return '<button class="btn-ghost" style="margin-top:4px;" onclick="startAddItem(\'' + wishId + '\')">+ 아이템 추가</button>';
    }
    return '' +
      '<div style="border:1px dashed var(--border); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:6px; margin-top:4px;">' +
        '<input type="text" placeholder="아이템 이름 * (예: 런닝화)" value="' + esc(d.name) + '" oninput="setAddItemField(\'name\', this)" />' +
        '<input type="text" placeholder="상품 링크 주소 (선택)" value="' + esc(d.link) + '" oninput="setAddItemField(\'link\', this)" />' +
        '<input type="text" placeholder="상품 이미지 URL (선택)" value="' + esc(d.imageUrl) + '" oninput="setAddItemField(\'imageUrl\', this)" />' +
        '<input type="number" placeholder="가격(목표 금액, 원) *" value="' + esc(d.goal) + '" oninput="setAddItemField(\'goal\', this)" />' +
        '<div style="display:flex; gap:8px;">' +
          '<button class="btn-ghost" style="flex:1;" onclick="cancelAddItem()">취소</button>' +
          '<button class="btn-primary" style="flex:1;" ' + (state.ui.savingAddItem ? 'disabled' : '') + ' onclick="saveAddItem()">' + (state.ui.savingAddItem ? '추가 중...' : '추가하기') + '</button>' +
        '</div>' +
      '</div>';
  }

  function renderChatPage() {
    var wishId = state.ui.chatWishId;
    var wish = state.wishes.filter(function (w) { return w.id === wishId; })[0];
    if (!wish) return '';
    var isOwner = wish.ownerId === state.user.id;

    if (isOwner && !state.ui.chatPeerId) {
      var threads = state.ui.chatThreads;
      var listBody = threads === null
        ? '<div class="empty-state">⏳<br/>불러오는 중...</div>'
        : (threads.length ? threads.map(function (t) {
            return '' +
              '<button type="button" onclick="openChatThread(\'' + wishId + '\', \'' + t.peerId + '\')" style="width:100%; display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--border); border-radius:14px; margin-bottom:8px; background:var(--card); text-align:left;">' +
                '<span style="font-size:20px;">' + t.peerAvatar + '</span>' +
                '<span style="flex:1; min-width:0;">' +
                  '<div style="font-size:13px; font-weight:800;">' + esc(t.peerName) + '</div>' +
                  '<div style="font-size:12px; color:var(--text-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + esc(t.lastText) + '</div>' +
                '</span>' +
                '<span style="color:var(--text-sub); font-size:16px;">›</span>' +
              '</button>';
          }).join('') : '<div class="empty-state">💬<br/>아직 대화가 없어요</div>');
      return '' +
        '<div class="detail-page" style="z-index:120;">' +
          '<div class="sheet-head"><button class="icon-btn" onclick="closeChat()">←</button><h2>💬 대화 목록</h2><span style="width:34px;"></span></div>' +
          listBody +
        '</div>';
    }

    var messages = state.ui.chatMessages;
    var msgHtml = messages === null
      ? '<div class="empty-state">⏳<br/>불러오는 중...</div>'
      : (messages.length ? messages.map(function (m) {
          var mine = m.fromUserId === state.user.id;
          return '' +
            '<div style="display:flex; flex-direction:column; align-items:' + (mine ? 'flex-end' : 'flex-start') + '; margin-bottom:8px;">' +
              (mine ? '' : '<div style="font-size:10.5px; font-weight:800; color:var(--text-sub); margin-bottom:2px; padding:0 4px;">' + esc(m.fromName) + '</div>') +
              '<div style="max-width:75%; padding:9px 12px; border-radius:14px; font-size:13px; line-height:1.4; word-break:break-word; background:' + (mine ? 'var(--primary)' : 'var(--card)') + '; color:' + (mine ? 'var(--primary-text)' : 'var(--text)') + '; border:' + (mine ? 'none' : '1px solid var(--border)') + ';">' + esc(m.text) + '</div>' +
              (mine ? '<button onclick="deleteChatMessage(\'' + m.id + '\')" style="background:none; border:none; color:var(--text-sub); font-size:10.5px; padding:2px 4px; cursor:pointer;">삭제</button>' : '') +
            '</div>';
        }).join('') : '<div class="empty-state">💬<br/>첫 메시지를 보내보세요!</div>');

    return '' +
      '<div class="detail-page" style="z-index:120;">' +
        '<div class="sheet-head"><button class="icon-btn" onclick="' + (isOwner ? 'backToChatThreads()' : 'closeChat()') + '">←</button><h2>💬 ' + esc(wish.title) + '</h2><span style="width:34px;"></span></div>' +
        '<div class="chat-scroll" style="flex:1; overflow-y:auto; display:flex; flex-direction:column;">' + msgHtml + '</div>' +
        '<div style="display:flex; gap:6px; position:sticky; bottom:0; background:var(--bg); padding-top:6px;">' +
          '<input id="chat-input" type="text" placeholder="메시지를 입력하세요" value="' + esc(state.ui.chatDraft) + '" oninput="setChatDraft(this)" style="flex:1;" />' +
          '<button class="btn-primary" style="width:auto; padding:0 16px;" ' + (state.ui.sendingChat ? 'disabled' : '') + ' onclick="sendChatMessage()">전송</button>' +
        '</div>' +
      '</div>';
  }

  function renderCreateWizard() {
    var w = state.ui.createWizard;
    var body = '';
    if (w.step === 1) {
      body = '' +
        '<div style="display:flex; flex-direction:column; gap:8px;">' +
          '<button type="button" class="template-card' + (w.wishType === 'personal' ? ' active' : '') + '" onclick="setWizardType(\'personal\')"><span class="emo">🙋</span><span><div class="t">개인 위시</div><div class="s">나 혼자만의 위시예요</div></span></button>' +
          '<button type="button" class="template-card' + (w.wishType === 'group' ? ' active' : '') + '" onclick="setWizardType(\'group\')"><span class="emo">👥</span><span><div class="t">단체 위시</div><div class="s">친구들과 함께 만드는 위시예요</div></span></button>' +
        '</div>' +
        (w.wishType === 'group' ? '' +
          '<input type="text" placeholder="그룹 이름 (예: 우리 가족, 축구팀)" value="' + esc(w.groupName) + '" oninput="wizardSetField(\'groupName\', this)" />' +
          '<div style="font-size:11px; color:var(--text-sub); line-height:1.5;">등록하면 초대 링크가 생겨요 - 그 링크를 친구에게 보내면 친구가 스스로 합류할 수 있어요.</div>'
        : '');
    } else if (w.step === 2) {
      body = '<div class="occasion-grid">' + OCCASIONS.map(function (o) {
        return '<div class="occasion-tile' + (w.occasion === o.type ? ' active' : '') + '" onclick="pickOccasion(\'' + o.type + '\')"><div class="emo">' + o.emoji + '</div><div class="lbl">' + esc(o.label) + '</div></div>';
      }).join('') + '</div>';
    } else if (w.step === 3) {
      var tpls = TEMPLATES[w.occasion] || [];
      body = '<div style="display:flex; flex-direction:column; gap:8px;">' +
        tpls.map(function (t, i) {
          return '<button type="button" class="template-card' + (w.templateIdx === i ? ' active' : '') + '" onclick="pickTemplate(' + i + ')"><span class="emo">' + w.emoji + '</span><span><div class="t">' + esc(t.title) + '</div><div class="s">' + esc(t.subtitle) + '</div></span></button>';
        }).join('') +
        '<button type="button" class="btn-ghost" onclick="skipTemplateCustom()">✏️ 직접 작성할게요</button>' +
      '</div>';
    } else if (w.step === 4) {
      var itemRows = w.items.map(function (it, idx) {
        return '' +
          '<div style="border:1px solid var(--border); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:6px;">' +
            '<div style="display:flex; gap:6px; align-items:center;">' +
              '<span style="font-size:11px; font-weight:900; color:var(--text-sub); width:16px;">' + (idx + 1) + '</span>' +
              '<input type="text" placeholder="아이템 이름 * (예: 런닝화)" value="' + esc(it.name) + '" oninput="wizardSetItemField(' + idx + ', \'name\', this)" style="flex:1;" />' +
              (w.items.length > 1 ? '<button type="button" class="icon-btn" style="width:26px; height:26px; font-size:11px;" onclick="removeWizardItem(' + idx + ')">✕</button>' : '') +
            '</div>' +
            '<input type="text" placeholder="상품 링크 주소 (선택)" value="' + esc(it.link) + '" oninput="wizardSetItemField(' + idx + ', \'link\', this)" />' +
            '<input type="text" placeholder="상품 이미지 URL (선택)" value="' + esc(it.imageUrl) + '" oninput="wizardSetItemField(' + idx + ', \'imageUrl\', this)" />' +
            '<input type="number" placeholder="가격(목표 금액, 원) *" value="' + esc(it.goal) + '" oninput="wizardSetItemField(' + idx + ', \'goal\', this)" />' +
          '</div>';
      }).join('');
      body = '' +
        '<input type="text" placeholder="위시 제목 * (예: 마라톤 대회 참가)" value="' + esc(w.title) + '" oninput="wizardSetField(\'title\', this)" />' +
        '<input type="text" placeholder="한 줄 소개" value="' + esc(w.subtitle) + '" oninput="wizardSetField(\'subtitle\', this)" />' +
        '<input type="number" placeholder="며칠 후 마감" value="' + esc(w.days) + '" oninput="wizardSetField(\'days\', this)" />' +
        '<textarea id="wizard-story-input" rows="3" placeholder="희망하는 이유를 들려주세요 (예: 우승을 위한 위시 리스트예요! 여행, 마라톤, 카메라, 커피 등 키워드를 넣으면 추천 아이템도 떠요)" oninput="wizardSetStory(this)">' + esc(w.story) + '</textarea>' +
        (w.suggestedItems.length ? '<div style="display:flex; flex-wrap:wrap; gap:6px;">' + w.suggestedItems.map(function (it) { return '<button type="button" class="suggest-chip" onclick="applySuggestion(\'' + esc(it) + '\')">+ ' + esc(it) + '</button>'; }).join('') + '</div>' : '') +
        '<div style="font-size:12.5px; font-weight:800; color:var(--text-sub); margin-top:4px;">🎁 위시 아이템 목록</div>' +
        '<div style="display:flex; flex-direction:column; gap:8px;">' + itemRows + '</div>' +
        '<button type="button" class="btn-ghost" onclick="addWizardItem()">+ 아이템 추가</button>';
    } else if (w.step === 5) {
      var isGroup = w.wishType === 'group';
      var previewOwnerRow = isGroup
        ? '<div class="row-top"><span style="font-size:16px;">👥</span><div class="owner">' + esc(w.groupName || '단체') + ' 위시</div><span class="dday">D-' + w.days + '</span></div>'
        : '<div class="row-top"><div class="avatar">' + state.user.avatar + '</div><div class="owner">' + esc(state.user.name) + '님의 위시</div><span class="dday">D-' + w.days + '</span></div>';
      var previewItems = w.items.filter(function (i) { return i.name.trim(); });
      var previewGoalSum = previewItems.reduce(function (s, i) { return s + (Math.max(1000, Number(i.goal) || 1000)); }, 0);
      body = '' +
        '<div class="wish-card style-' + state.customization.cardStyle + '" style="margin:0;">' +
          previewOwnerRow +
          '<div class="title">' + w.emoji + ' ' + esc(w.title || '제목 없음') + '</div>' +
          '<div class="subtitle">' + esc(w.subtitle) + '</div>' +
          '<div class="gauge-track"><div class="gauge-fill" style="width:0%;"></div></div>' +
          '<div class="stat-row"><span class="pct">0% 달성</span><span class="amt">0원 / ' + formatWon(previewGoalSum) + '</span></div>' +
        '</div>' +
        '<div style="font-size:12.5px; font-weight:800; color:var(--text-sub); margin-top:6px;">🎁 아이템 ' + previewItems.length + '개</div>' +
        previewItems.map(function (i) { return '<div class="cheer-item"><span class="who">' + esc(i.name) + '</span><span class="amt">' + formatWon(Math.max(1000, Number(i.goal) || 1000)) + '</span></div>'; }).join('') +
        '<div style="font-size:12px; color:var(--text-sub); text-align:center; margin-top:4px;">이렇게 등록돼요. 확인하고 완료를 눌러주세요!</div>';
    }
    var footer = '<div style="display:flex; gap:8px;">' +
      (w.step > 1 ? '<button class="btn-ghost" style="flex:1;" onclick="wizardPrevStep()">이전</button>' : '') +
      (w.step !== 2 && w.step < 5 ? '<button class="btn-primary" style="flex:2;" onclick="wizardNextStep()">다음</button>' : '') +
      (w.step === 5 ? '<button class="btn-primary" style="flex:2;" ' + (state.ui.creatingWish ? 'disabled' : '') + ' onclick="finishWizard()">' + (state.ui.creatingWish ? '⏳ 등록 중...' : '🎉 위시 등록 완료') + '</button>' : '') +
    '</div>';
    return '' +
      '<div class="sheet-backdrop" onclick="closeCreateWizard()">' +
        '<div class="bottom-sheet" onclick="event.stopPropagation()">' +
          '<div class="sheet-head"><h2>위시 만들기 (' + w.step + '/5)</h2><button class="icon-btn" onclick="closeCreateWizard()">✕</button></div>' +
          body +
          footer +
        '</div>' +
      '</div>';
  }

  function renderCustomizeSheet() {
    var c = state.customization;
    var colorRow = THEME_COLORS.map(function (t) {
      return '<div class="swatch' + (c.themeColor === t.id ? ' active' : '') + '" style="background:' + t.primary + ';" title="' + esc(t.label) + '" onclick="setThemeColor(\'' + t.id + '\')"></div>';
    }).join('');
    var layoutRows = PROFILE_LAYOUTS.map(function (l) {
      return '<div class="option-item' + (c.profileLayout === l.id ? ' active' : '') + '" onclick="setProfileLayout(\'' + l.id + '\')"><span>' + esc(l.label) + '</span>' + (c.profileLayout === l.id ? '✓' : '') + '</div>';
    }).join('');
    var cardRows = CARD_STYLES.map(function (s) {
      return '<div class="option-item' + (c.cardStyle === s.id ? ' active' : '') + '" onclick="setCardStyle(\'' + s.id + '\')"><span>' + esc(s.label) + '</span>' + (c.cardStyle === s.id ? '✓' : '') + '</div>';
    }).join('');
    var widgetDefs = [ { key: 'dday', label: 'D-Day 카운트다운' }, { key: 'gaugeRing', label: '달성률 게이지 링' }, { key: 'cheerToast', label: '최근 응원 롤링 토스트' } ];
    var widgetRows = widgetDefs.map(function (wd) {
      return '<div class="option-item" onclick="toggleWidget(\'' + wd.key + '\')"><span>' + esc(wd.label) + '</span><button class="toggle' + (c.widgets[wd.key] ? ' on' : '') + '"></button></div>';
    }).join('');
    return '' +
      '<div class="sheet-backdrop" onclick="closeCustomize()">' +
        '<div class="bottom-sheet" onclick="event.stopPropagation()">' +
          '<div class="sheet-head"><h2>🎨 화면 꾸미기</h2><button class="icon-btn" onclick="closeCustomize()">✕</button></div>' +
          '<div><div style="font-size:12.5px; font-weight:800; color:var(--text-sub); margin-bottom:8px;">테마 컬러</div><div class="swatch-row">' + colorRow + '</div></div>' +
          '<div><div style="font-size:12.5px; font-weight:800; color:var(--text-sub); margin-bottom:8px;">프로필 레이아웃</div><div class="option-row">' + layoutRows + '</div></div>' +
          '<div><div style="font-size:12.5px; font-weight:800; color:var(--text-sub); margin-bottom:8px;">위시 카드 스타일</div><div class="option-row">' + cardRows + '</div></div>' +
          '<div><div style="font-size:12.5px; font-weight:800; color:var(--text-sub); margin-bottom:8px;">위젯</div><div class="option-row">' + widgetRows + '</div></div>' +
          '<button class="btn-primary" onclick="closeCustomize()">완료</button>' +
        '</div>' +
      '</div>';
  }

  // IME(한글) 조합 이벤트 - oncompositionstart/end는 인라인 어트리뷰트로 등록해도 브라우저가
  // GlobalEventHandlers로 인식하지 않아 죽은 코드가 되므로 document에 위임한다. render()가
  // #root를 통째로 교체해 매번 새 입력창 노드가 생겨도 document 리스너는 유효하다. 홈 화면
  // 검색창도 15초 백그라운드 동기화 중 render()가 불릴 수 있어 같은 가드가 필요하다.
  document.addEventListener('compositionstart', function (e) {
    if (e.target && (e.target.id === 'wizard-story-input' || e.target.id === 'home-search-input' || e.target.id === 'chat-input')) e.target.dataset.composing = 'true';
  });
  document.addEventListener('compositionend', function (e) {
    if (!e.target) return;
    if (e.target.id === 'wizard-story-input') {
      e.target.dataset.composing = 'false';
      window.wizardSetStory(e.target);
    } else if (e.target.id === 'home-search-input') {
      e.target.dataset.composing = 'false';
      window.onHomeSearchInput(e.target);
    } else if (e.target.id === 'chat-input') {
      e.target.dataset.composing = 'false';
      window.setChatDraft(e.target);
    }
  });

  // 채팅창이 열려있는 동안엔 4초마다 조용히 새 메시지를 받아온다(실시간 웹소켓 없이 폴링으로
  // "실시간"에 가깝게 흉내). 조합 중 render() 스킵은 render() 자체의 IME 가드가 처리한다.
  setInterval(function () {
    if (!state.ui.chatWishId || !state.ui.chatPeerId) return;
    fetch(API_BASE + '/api/wishes/' + encodeURIComponent(state.ui.chatWishId) + '/chat?peer_id=' + encodeURIComponent(state.ui.chatPeerId))
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        if (!data || state.ui.chatWishId === null || state.ui.chatPeerId === null) return;
        state.ui.chatMessages = data.messages || [];
        render();
      })
      .catch(function () {});
  }, 4000);

  // "최근 응원 롤링 토스트" 위젯 - 순수 홈 피드가 보이는 동안만 몇 초마다 다음 응원으로 돌린다.
  // 위시 상세/위저드/꾸미기 시트가 위에 떠 있을 때는 절대 render()를 부르지 않는다 - 부르면 그
  // 시트 안에서 타이핑 중인 입력창(id 없는 응원메시지 등)이 몇 초마다 포커스를 잃는, keongyu의
  // 검색창 버그와 같은 종류의 문제가 생긴다.
  setInterval(function () {
    if (!state.customization.widgets.cheerToast || state.ui.tab !== 'home') return;
    if (state.ui.wishDetailId || state.ui.createWizard || state.ui.customizeOpen) return;
    var recent = collectRecentCheers();
    if (recent.length < 2) return;
    state.ui.cheerTickerIndex = ((state.ui.cheerTickerIndex || 0) + 1) % recent.length;
    render();
  }, 4000);

  // "친구랑 같이 쓰는" 위시보드의 핵심은 다른 사람이 보탠 게 내 화면에도 보여야 한다는 건데,
  // 내가 직접 뭔가 하지 않는 한(위시 등록/보태기) 화면이 다시 서버를 조회할 일이 아예 없었다 -
  // 친구가 방금 보탠 걸 확인하려면 새로고침해야만 했다. 주기적으로 조용히 새로 받아온다.
  // 시트가 열려있을 때 건드리면 안 되는 이유는 위 인터벌과 같다.
  setInterval(function () {
    if (state.ui.wishDetailId || state.ui.createWizard || state.ui.customizeOpen) return;
    syncWishesFromServer();
    syncNotificationsFromServer();
  }, 15000);

  applyKakaoLoginResult(); // 카카오 로그인 리다이렉트로 막 돌아온 경우, 첫 render 전에 신원부터 반영
  // 새로고침했거나 위시 상세 링크로 바로 들어온 경우 - 해시에 남아있는 #wish=id를 복원한다.
  (function () {
    var m = /#wish=([^&]+)/.exec(location.hash);
    if (m) state.ui.wishDetailId = m[1];
  })();
  render(); // 서버 응답 오기 전에도 "불러오는 중" 화면이 바로 보이게 먼저 한 번 그린다
  joinWishFromUrl();
  syncWishesFromServer();
  syncNotificationsFromServer();
})();
</script>
</body>
</html>
